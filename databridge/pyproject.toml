# DataBridge monorepo root (02_TRD A.2). uv-managed workspace; Python 3.11+.
# T01 wires packages/core (the dependency root). More packages join as they are built.
[project]
name = "databridge"
version = "0.0.0"
description = "DataBridge — semantic data conversion & company-brain POC (Stage 1)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.pytest.ini_options]
# pythonpath lets tests import packages without an editable install (no uv needed to
# run the suite). `scripts` exposes the vendor-import checker to its test.
pythonpath = ["packages/core", "packages/harness", "packages/ingest", "packages/semantic",
              "packages/convert", "packages/graph", "packages/intake", "packages/agent",
              "packages/evals", "apps/cli", "apps/gateway", "apps/mcp_server", "scripts"]
testpaths = ["tests", "packages/core/tests", "packages/harness/tests",
             "packages/ingest/tests", "packages/semantic/tests",
             "packages/convert/tests", "packages/graph/tests", "packages/intake/tests",
             "packages/agent/tests", "packages/evals/tests", "apps/cli/tests",
             "apps/gateway/tests", "apps/mcp_server/tests"]
markers = ["integration: hits a real backend (Ollama/LiteLLM); skips when unavailable"]
