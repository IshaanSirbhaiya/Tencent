# packs/enterprise — the OPERATOR-SURFACE vocabulary for Company A (presentation half; the kinds are
# in `ontology.yaml`). Served by `GET /packs` (apps/gateway/.../pack_routes.py) to the ORIGINAL
# Walnut frontend (apps/frontend), so its signature screens — /graph, /brain, /ontology, /evidence
# and the guided /demo tour — run on the same synthetic world the Internal Brain uses.
#
# The graph behind these screens is built by `scripts/build_enterprise_graph.py` from
# fixtures/enterprise/world.json AS ONE PERSON SEES IT (default jdoe, `--as <persona>`), at build
# time. It is a snapshot: it does not re-check access per request. The permission-aware product, with
# live checks, is the Internal Brain (apps/internal_brain, apps/internal_brain_web).
#
# Icons are keys of SURFACE_ICONS in apps/frontend/components/sidebar.tsx. Node ids named below
# (`demo_focus_node`, the evidence chips) are `kind:key` ids the build computes from world.json.
# Synthetic throughout: Company A, companya.example.

pack: enterprise
label: Company A
tagline: Company A's wiki, tickets, chat and shared drives as one cited knowledge graph.
nouns:
  subject: person
  subject_plural: people
  subject_title: Person
  subject_plural_title: People
  org: team
  org_plural: teams
  org_title: Team
  registry: company directory
  record: record
  graph: knowledge graph
  workspace: Company A brain
  counterparty: space
  counterparty_plural: spaces
  document: item
  determination: link
  operator_surface: Knowledge graph
  operator_role: knowledge owner
  queue: sources
  identifier: work email address
  credential: directory account
  document_examples: a wiki page, a ticket, a chat thread or a shared file
  pitch: >
    Company A is a fictional fintech. Its Confluence, Jira, Slack and Google Drive export is
    loaded here as one graph, and every node and link points back to the row it came from.
    This is Jordan Doe's view (backend engineer) at build time: only what Jordan can open.
# One person only: the graph is built as jdoe sees it, so the roster offers jdoe and nobody else
# (offering other people here would show them Jordan's items). Rebuild with --as <persona> to change.
roster:
  - {staffId: jdoe, name: Jordan Doe, role: Backend engineer (this graph is Jordan's view)}
surfaces:
  - href: /graph
    label: Knowledge graph
    icon: graph
  - href: /brain
    label: Company brain
    icon: brain
  - href: /ontology
    label: Ontology
    icon: chart
  - href: /evidence
    label: Provenance
    icon: queue
  - href: /trace
    label: Activity
    icon: chart
trials:
  intelligence: []
  evidence:
    - label: Nodes
      note: Pick one to see where each of its values came from — the row, the column and the file.
      chips:
        - id: ev-page
          label: "page: DB Migration Plan"
          payload: knowledge_page:cf-1001
        - id: ev-issue
          label: "issue: DBMIG-14"
          payload: tracked_issue:dbmig-14
        - id: ev-person
          label: "colleague: Jordan Doe"
          payload: colleague:jdoe
        - id: ev-space
          label: "space: Payment Gateway"
          payload: knowledge_space:confluence-payment-gateway
    - label: Links
      note: A link is traced the same way — this one says which space holds the migration plan.
      chips:
        - id: ev-edge-held
          label: Payment Gateway holds DB Migration Plan
          payload: knowledge_space:confluence-payment-gateway|held_in|knowledge_page:cf-1001
        - id: ev-edge-cites
          label: DBMIG-12 cites DBMIG-14
          payload: tracked_issue:dbmig-12|cites_item|tracked_issue:dbmig-14
  intake: []
demo_steps:
  - route: /graph
    caption: >-
      This is Company A's knowledge graph: people, teams, spaces, and the pages, tickets, chat
      threads and files they hold. Every node was built from one row of the synthetic export.
    ms: 9000
  - route: /graph
    caption: >-
      The best-connected nodes are drawn first. Click any node to open its panel, then expand it
      to pull in its neighbours, one step at a time.
    ms: 9000
  - route: /brain
    caption: >-
      The same graph as a company brain, every node at once. Colours follow the legend on the
      left, and the numbers underneath are counted from the graph itself.
    ms: 12000
  - caption: >-
      The time slider rewinds to 1 March 2026 for a few seconds. Anything created after that day
      disappears, including every Slack thread in this export, then it all comes back.
    action: slider
    ms: 9000
  - caption: >-
      Here is the DB Migration Plan page. Its note lists each value next to the source it was
      read from, so you can check it yourself.
    action: node
    ms: 10000
  - route: /evidence?entity=knowledge_page%3Acf-1001
    caption: >-
      Provenance for one page: each value, the pointer it carries, and the table, column and row
      it came from.
    ms: 10000
  - route: /ontology
    caption: >-
      The ontology behind it: seven node kinds and eight link kinds, declared in one pack file.
      The engine code does not name any of them.
    ms: 9000
  - route: /graph
    caption: >-
      That's the tour. This graph shows who has access to each space but doesn't enforce it.
      The Internal Brain does that every time someone asks a question.
    ms: 7000
demo_focus_node: knowledge_page:cf-1001
demo_as_of: "2026-03-01T00:00:00+08:00"
demo_question: ""
graph_vocabulary:
  node_kinds:
    colleague:       {color: "#6f9fd8", label: Colleague}
    org_team:        {color: "#5fa98d", label: Team}
    knowledge_space: {color: "#c9a25f", label: Space / project / channel / drive}
    knowledge_page:  {color: "#9a8fc9", label: Wiki page}
    tracked_issue:   {color: "#c4827a", label: Ticket}
    chat_thread:     {color: "#5f9fb0", label: Chat thread}
    shared_file:     {color: "#8fae6a", label: Shared file}
  edge_labels:
    on_team: on team
    includes_team: includes team
    reads_space: can read
    held_in: holds
    wrote_item: wrote
    assigned_item: assigned to
    has_subpage: has subpage
    cites_item: cites
brain_suggested_fallback:
  - Who wrote the DB Migration Plan?
  - Which tickets are in the Database Migration project?
  - Which teams can read the Payment Gateway space?
