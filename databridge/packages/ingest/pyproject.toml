# packages/ingest — connectors + adapters → SchemaExtract / records.
[project]
name = "databridge-ingest"
version = "0.0.0"
description = "DataBridge ingestion: SchemaExtract models + fixtures (live connectors land later)"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_ingest"]

[tool.hatch.build.targets.wheel.force-include]
"databridge_ingest/fixtures" = "databridge_ingest/fixtures"
