# packages/workflow_spec — the FROZEN contract for user-defined agents and adapter agents
# (BUILD_PLAN_KNOWLEDGE_PLATFORM.md §5.6). Behaviour only: the governance half of an agent is an
# `agentdef` declaration, compiled by `compile_agent`. Owned by the coordinator; a change here is a
# contract change and is recorded in the build plan's §12.
[project]
name = "databridge-workflow-spec"
version = "0.1.0"
description = "Walnut WorkflowSpec / AdapterAgentSpec: what an agent does, when, and over which sources"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_workflow_spec"]
