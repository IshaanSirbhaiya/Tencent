# packages/convert — the conversion engine (Pillar 2).
[project]
name = "databridge-convert"
version = "0.0.0"
description = "DataBridge conversion engine: S→S rules, coercions, artifacts (C05-C07); IR + adapters (C01-C04)"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "databridge-harness",
  "pydantic>=2.7",
  "duckdb>=1.0",
  "jsonata-python>=0.5",
  "pyarrow>=15",
  "orjson>=3",
  "scipy>=1.10",
  "safetensors>=0.4",
]

[project.optional-dependencies]
adapters = ["ruamel.yaml>=0.18", "lxml>=5"]   # C04 semi-structured adapters (PROMPT 6)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_convert"]
