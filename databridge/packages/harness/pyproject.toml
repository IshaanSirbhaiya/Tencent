# packages/harness — the ONLY package permitted to import a vendor SDK (ADR-0002).
[project]
name = "databridge-harness"
version = "0.0.0"
description = "DataBridge model harness: one LiteLLM-backed abstraction for every LLM call"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "pydantic>=2.7",
  "litellm>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_harness"]
