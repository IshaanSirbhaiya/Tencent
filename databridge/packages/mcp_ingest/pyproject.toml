# packages/mcp_ingest — "connect any MCP server and Walnut extracts from it on its own".
# Connection registry, MCP client (stdio + streamable HTTP, direct or via MCPJungle), crawl plans
# (rules first, model second), a staged run that leaves an artefact per stage, a content-addressed
# capture store, a deterministic pre-model screen, and ontology-constrained graph building.
# See KNOWLEDGE_SYSTEM_PRINCIPLES.md §1–§4 and §8 — this package is their embodiment.
[project]
name = "databridge-mcp-ingest"
version = "0.0.0"
description = "Walnut MCP ingestion: declare a source, plan a crawl, capture, screen, build the graph"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "databridge-harness",
  "databridge-convert",
  "databridge-graph",
  "mcp>=1.20",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
# PDF / DOCX / PPTX / XLSX text extraction. Without it those types are recorded in
# extract_skipped.jsonl with reason `extractor_unavailable` — never silently dropped.
docling = ["docling>=2"]

[project.scripts]
walnut-mcp-ingest = "databridge_mcp_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_mcp_ingest"]
