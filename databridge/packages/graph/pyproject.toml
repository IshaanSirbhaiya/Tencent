# packages/graph — the clinic operational brain. Bi-temporal knowledge graph over SQLite
# (stdlib), grounded NL query, and the clinic seed. Reuses convert (claim_check, C15) + harness.
[project]
name = "databridge-graph"
version = "0.0.0"
description = "DataBridge graph: bi-temporal clinic knowledge graph (ADR-0009)"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "databridge-harness",
  "databridge-convert",
  # clinic_seed builds the graph from the intake registry, resolver and coverage rules, and is
  # re-exported from databridge_graph.__init__ — so this is a hard dependency of the package's
  # primary entry point, not an optional extra. The test suite passes without it declared only
  # because the root pytest `pythonpath` lists every package; an installed wheel would not.
  "databridge-intake",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_graph"]
