# packages/graph — the Company Brain (Pillar 1, T08). Bi-temporal knowledge graph over
# SQLite (stdlib), grounded NL query, demo seed. Reuses convert (claim_check, C15) + harness.
[project]
name = "databridge-graph"
version = "0.0.0"
description = "DataBridge graph: bi-temporal Company-Brain knowledge graph (T08)"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "databridge-harness",
  "databridge-convert",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_graph"]
