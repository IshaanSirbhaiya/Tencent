# packages/retrieval — hybrid, routed, memory-honest passage retrieval (BUILD_PLAN §5.5 / §6 G,
# principles P6 P11 P14 P17). Prose → chunks + vectors + FTS5; embeddings only via the harness.
[project]
name = "databridge-retrieval"
version = "0.0.0"
description = "Walnut passage store + hybrid (vector + FTS5, RRF) retrieval with a centroid router"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "databridge-harness",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_retrieval"]
