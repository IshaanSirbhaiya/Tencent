# packages/intake — Walnut's intake pipeline, for Hack4Health (PLAN.md §1).
# classify → extract → ground → resolve → eligibility → prefill → billing → ledger → metrics.
# Reuses core (provenance), harness (LLM), convert (grounding wall + document IR).
[project]
name = "databridge-intake"
version = "0.0.0"
description = "Walnut — pre-registration & eligibility intake pipeline (Hack4Health 2026)"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "databridge-harness",
  "databridge-convert",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rapidfuzz>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_intake"]
