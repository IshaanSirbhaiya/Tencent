# packages/core — the dependency root (ADR-0001). Zero LLM/vendor deps.
[project]
name = "databridge-core"
version = "0.0.0"
description = "DataBridge core: shared types, provenance, config, events"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_core"]
