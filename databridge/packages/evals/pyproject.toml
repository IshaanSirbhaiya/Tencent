# packages/evals — the eval harness (07_PRD Part II). T07 ships E1; full board in T11/C24.
[project]
name = "databridge-evals"
version = "0.0.0"
description = "DataBridge evaluation suites (E1 schema annotation; more land in T11/C24)"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "databridge-ingest",
  "databridge-harness",
  "databridge-semantic",
  # e_intake imports both: the graph (store, extractor, clinic seed) and convert's claim_check.
  "databridge-graph",
  "databridge-convert",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_evals"]

[tool.hatch.build.targets.wheel.force-include]
"databridge_evals/data" = "databridge_evals/data"
