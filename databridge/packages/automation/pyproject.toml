# packages/automation — the English compiler + the trigger engine (BUILD_PLAN_KNOWLEDGE_PLATFORM §6 T).
# Plain English -> WorkflowSpec / AdapterAgentSpec (+ agentdef declaration, compiled) with open
# questions instead of guesses; and an asyncio TriggerEngine (cron, §5.3 events, manual) that
# dispatches through an injected runner. LLM access only through packages/harness.
[project]
name = "databridge-automation"
version = "0.1.0"
description = "Walnut automation: compile English into governed agents and fire them on schedule, event or demand"
requires-python = ">=3.11"
dependencies = [
  "databridge-workflow-spec",
  "databridge-agentdef",
  "databridge-agent-runtime",   # the ONE declaration generator + capability names (W2)
  "databridge-harness",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_automation"]
