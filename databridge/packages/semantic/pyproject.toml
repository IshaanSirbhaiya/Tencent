# packages/semantic — the moat: schema understanding + label discovery.
[project]
name = "databridge-semantic"
version = "0.0.0"
description = "DataBridge semantic layer: schema graph, LLM annotator, confirmation"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "databridge-ingest",
  "databridge-harness",
  "pydantic>=2.7",
  "networkx>=3",
  "sqlglot>=20",
  "rich>=13",
  "prompt-toolkit>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_semantic"]
