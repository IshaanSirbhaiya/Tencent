# packages/agentdef — agent declarations, and the compiler that turns them into grants
# (AGENT_PLANE.md D10/D11).
#
# DECLARATION AND COMPILATION ONLY. No I/O beyond reading pack YAML off disk, no credentials, no
# network, no LLM, and no graph writes. Everything here is a value object or a pure function over
# value objects, for the same reason `packages/adapter` is: a compiler that could call a model
# would produce a different grant on Tuesday, and a grant that is not reproducible is not a grant.
[project]
name = "databridge-agentdef"
version = "0.0.0"
description = "DataBridge agent plane: agent declarations compiled to capability grants (AGENT_PLANE D10/D11)"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  # The compiler reads packs/<pack>/purposes.yaml through the adapter's purpose loader, and the
  # sink policy is named against the adapter's own TRUSTED_SINKS. One definition of each, not two.
  "databridge-adapter",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_agentdef"]
