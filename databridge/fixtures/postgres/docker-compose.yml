# DataBridge fintech fixture Postgres (02_TRD Task 3 / PROMPT 7).
# Bring up:   docker compose -f fixtures/postgres/docker-compose.yml up -d
# Connect:    postgresql+psycopg2://databridge:databridge@localhost:5432/fintech
# The seed.sql is auto-applied on first init (docker-entrypoint-initdb.d).
#
# A SEPARATE read-only role is created for source connections (§15.1: read-only creds
# required; the connector's privilege probe refuses/flags a writable source role).
services:
  fintech_pg:
    image: postgres:16
    container_name: databridge_fintech_pg
    environment:
      POSTGRES_USER: databridge
      POSTGRES_PASSWORD: databridge
      POSTGRES_DB: fintech
    ports:
      - "5432:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
      - ./readonly_role.sql:/docker-entrypoint-initdb.d/02_readonly_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databridge -d fintech"]
      interval: 3s
      timeout: 3s
      retries: 10
