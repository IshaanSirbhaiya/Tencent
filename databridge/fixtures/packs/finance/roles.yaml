# =====================================================================
# roles.yaml -- who may read what, in the Walnut synthetic finance estate
#
# SYNTHETIC FIXTURE. The bank, the roles, the clients and the people are
# invented.
#
# This file is (a) the POLICY an adapter's Policy layer enforces and (b) half
# of the contract `describe()` answers against. It is declarative on purpose:
# adding a role, a column restriction or a whole source must never require a
# code change.
#
# Five rules from the spine govern how it is read:
#
#   D3  -- untrusted values may be stored, cited and displayed. They may NEVER
#          influence control flow. That includes access control: an untrusted
#          field may not appear in a row predicate. See
#          `untrusted_fields_forbidden_in_predicates`.
#
#   D4  -- `policy_withheld` is a state distinct from `unresolved`. "Not
#          present in the source" and "present, not permitted to you" are
#          different facts. A withheld field is present in the record with
#          value None, carries a WithholdingRecord (field path, policy id,
#          reason code, principal), and is REMOVED from `unresolved`.
#          IMPORTANT: this is a FIELD-level guarantee and it holds only once
#          the principal is authorised to know the object exists. See
#          `existence_disclosure`.
#
#   D4a -- the enforcement point is pointer resolution, not graph query.
#          Everything below is evaluated when a pointer resolves to a value,
#          which is the one choke point every read path passes through.
#
#   D4b -- the pack declares its SUBJECT KIND. Here it is `party`, and nothing
#          may auto-confirm a party's identity. See `subject_kinds`.
#
#   D5  -- purpose is part of the principal. A role alone grants nothing; the
#          (role, purpose, object) triple does.
#
# Note on predicates: the `row_filters` strings below are DECLARATIVE SCOPE
# DEFINITIONS that the Policy layer compiles. They are written in SQL-like
# syntax for readability only. Nothing generates SQL from natural language and
# nothing executes these strings as submitted text (ADAPTER_AGENT_SPEC §6).
# =====================================================================

version: 2
estate: walnut-finance-synthetic
notice: "SYNTHETIC FIXTURE -- no real organisation, person or client is represented."
supersedes: "version 1, revised against review phase2-3-b4-finance. Disposition log: wiki/40-reviews/R-004-finance-estate-fixes.md"

# =====================================================================
# 1. EVALUATION ORDER -- defined once, at schema level.
#
# Version 1 defined behaviour only for denied COLUMNS, and left the ordering
# of deny/mask/row-filter/aggregate implicit. Where `deny_columns` and
# `column_masks` both named a column (RM and `party.date_of_birth`) the
# outcome depended on which the implementer happened to apply first.
#
# A single stage may only ever make the answer MORE restrictive. No later
# stage can re-admit what an earlier one refused.
# =====================================================================
evaluation_order:
  - stage: 1_role_context
    does: "select exactly one active role context. See `combination_semantics`."
    on_failure: {verdict: FORBIDDEN, reason: POLICY_NO_ACTIVE_CONTEXT}
  - stage: 2_principal_attributes
    does: "bind :principal.* from the AUTHENTICATED credential. See `principal_attributes`."
    on_failure: {verdict: FORBIDDEN, reason: POLICY_UNATTESTED_PRINCIPAL_ATTRIBUTE}
  - stage: 3_purpose
    does: "validate the declared purpose against `purposes`, against the role's list, AND against `purpose_scoped_grants` for this object."
    on_failure: {verdict: FORBIDDEN, reason: POLICY_PURPOSE_MISMATCH}
  - stage: 4_expiry_and_obligations
    does: "check `expires_on` and any obligation that is a precondition rather than a consequence (four-eyes). See `obligation_specs`."
    on_failure: {verdict: FORBIDDEN, reason: POLICY_GRANT_EXPIRED}
  - stage: 5_deny
    does: "apply `deny_sources`, then `deny_tables`, then `deny_columns`. DENY WINS, always, over every allow and every mask, in this role and in every other role the principal holds."
    on_failure: {verdict: FORBIDDEN, reason: "the denial's own reason code"}
  - stage: 6_object
    does: "find the object in the active role's `allow`."
    on_failure: {reason: POLICY_ROLE_SCOPE}
  - stage: 7_egress
    does: "compare the object's egress_class (sources.yaml) to the role's `egress_ceiling`."
    on_failure: {verdict: FORBIDDEN, reason: POLICY_EGRESS_CEILING}
  - stage: 8_row_scope
    does: >-
      Evaluate the object's row scope -- from `row_filters`, or from
      `unscoped_objects` if it is declared unscoped. This does NOT produce a
      filtered row set; it produces a row DISPOSITION, one of `disclosed`,
      `contents_withheld` or `existence_not_disclosed`. See
      `existence_disclosure`.
    on_uncompilable: {verdict: FORBIDDEN, reason: POLICY_ROW_SCOPE_UNCOMPILABLE}
    on_missing: {verdict: FORBIDDEN, reason: POLICY_ROW_SCOPE_UNDECLARED}
  - stage: 9_column_projection
    does: >-
      Keep only the columns the grant admits. EVERY other column of the object
      is emitted as a Withheld cell with a reason code -- never silently
      dropped. Default reason POLICY_DATA_MINIMIZATION.
    closed_world: true
    on_unclassified_column: deny
    on_unclassified_column_note: >-
      A column present in the source but absent from BOTH the role's
      projection AND `column_classification` is a schema addition nobody has
      reviewed. It fails CLOSED: Withheld with POLICY_UNCLASSIFIED_COLUMN.
      Schema evolution must not be a silent access-control change.
  - stage: 10_free_text
    does: "apply `free_text_policy`. All free text is withheld unless the role holds a named exception."
  - stage: 11_transform
    does: >-
      Apply masks. A masked cell is emitted as Withheld carrying a `transform`
      record, NOT as a GroundedValue. A masked string does not appear in the
      source and must never pass the grounding wall or be citable as evidence.
    note: "a column that reached here having been denied at stage 5 is a loader error, not a runtime race: deny and mask may not both name one column. See `deny_mask_precedence`."
  - stage: 12_aggregate
    does: "apply small-cell, cohort and differencing controls for aggregate-only roles. See `aggregate_policy`."
  - stage: 13_ledger
    does: "append the read to the ledger -- role context, purpose, object, row disposition, every withholding, every transform -- BEFORE the value returns (D4a)."

deny_mask_precedence:
  rule: "DENY WINS. A column named in both `deny_columns` and `column_masks` is withheld outright; the mask never runs."
  loader_check: >-
    A column appearing in both lists for one role is a POLICY LOADER ERROR, not
    a runtime precedence question. Version 1 had exactly one such overlap
    (`relationship_manager` denied AND year-masked
    `core_banking.party.date_of_birth`); the mask has been deleted and the
    denial kept, which is the safe direction.

# =====================================================================
# 2. ROLE COMBINATION SEMANTICS
#
# Version 1 said nothing about a principal holding two roles, and "nothing" is
# read by an implementer as "union". A naive union combines the auditor's
# estate-wide row scope with the RM's unmasked columns and yields estate-wide
# unmasked client data -- an escalation neither role was granted.
# =====================================================================
combination_semantics:

  active_context: exactly_one
  active_context_rule: >-
    A request activates EXACTLY ONE role context, bound at request time as
    (role_id, purpose, on_behalf_of). A principal holding three roles makes
    three separate requests and each is separately logged. There is no implicit
    union, no "best matching role", and no fallback to a second role when the
    first refuses.
  active_context_selection: >-
    The context is chosen by the CALLER and validated, never inferred from what
    would return the most data. A request naming no role context is FORBIDDEN,
    not defaulted.

  grant_atomicity: >-
    THE CENTRAL RULE. A grant is an indivisible tuple:
      (object, row_scope, columns, transformations, purposes, egress_ceiling).
    A cell is disclosed if and only if ONE SINGLE grant authorises the whole
    tuple. Row scopes and column sets are NEVER unioned independently. There is
    no path by which one grant's rows meet another grant's columns.

  within_one_context: >-
    Where two rules in one role cover one cell, the MOST RESTRICTIVE outcome
    wins: withheld > transformed > raw. Compared per cell, not per rule.

  deny_precedence: >-
    Deny beats allow, unconditionally, in the active context and in every other
    role the principal holds. A `deny_sources` / `deny_tables` / `deny_columns`
    entry anywhere on the principal is a hard stop. This is the one place roles
    DO combine, and they combine only in the restrictive direction.

  sticky_output_constraints: >-
    `aggregate_only`, `pointers_only`, `metadata_only` and every mask are
    STICKY: they attach to the DERIVED VALUE, not to the request that produced
    it. A value produced under an aggregate-only context stays aggregate-only
    however it is later joined, cached or re-read, and a pseudonymised
    identifier may not be re-joined to a raw one in a later request. Without
    this, a principal holding `model_developer` and any identity-bearing role
    joins the hashed and the raw records in two steps and calls it one
    workflow.

  extends: >-
    `extends` copies the parent's body, then applies the child's keys, which
    REPLACE rather than union (`row_filters` merge key-by-key). An override
    that WIDENS must restate the whole affected tuple, so widening is always
    visible in the diff. `senior_relationship_manager` restates every row
    filter it widens, for exactly this reason.

  mutually_exclusive_roles:
    # Segregation of duties. Holding both is a PROVISIONING error, refused at
    # grant time rather than resolved at runtime.
    - {roles: [auditor, relationship_manager], reason: "an auditor must not audit their own book"}
    - {roles: [auditor, senior_relationship_manager], reason: "as above, for the team's book"}
    - {roles: [auditor, credit_analyst], reason: "an auditor must not audit their own assessments"}
    - {roles: [external_auditor, "*"], reason: "an outside firm holds one role and nothing else"}
    - {roles: [model_developer, relationship_manager], reason: "pseudonymised model features must not meet the raw book in one principal"}
    - {roles: [model_developer, senior_relationship_manager], reason: "as above"}
    - {roles: [model_developer, credit_analyst], reason: "as above"}
    - {roles: [model_developer, compliance_officer], reason: "as above"}
    - {roles: [platform_operator, "*"], reason: "a metadata-only operator is never combined with a value-reading role"}
    - {roles: [portfolio_analyst, relationship_manager], reason: "aggregate-only output must not be differenced against a known individual book"}
  on_mutually_exclusive: refuse_provisioning

  no_escalation_invariant: >-
    For every principal P and every pair of roles P holds, the set of cells
    disclosable to P must EQUAL the union over each role's INDEPENDENTLY
    evaluated disclosable set -- never more. Any implementation whose combined
    result exceeds that union has broken grant atomicity.

# =====================================================================
# 3. PURPOSE (D5)
#
# The loader reads `purposes` at role level, so that list is the UNION of the
# purposes a role may act under -- it is NOT itself a grant. What each purpose
# actually reaches within the role is declared in `purpose_scoped_grants`
# below, and a purpose that reaches an object not listed there is FORBIDDEN.
#
# Two escalations in version 1 came from the missing narrowing:
#   * `credit_analyst` held `credit_assessment` AND `portfolio_analytics`, so
#     its raw named-row permissions were usable for portfolio analytics,
#     bypassing the aggregate-only protection assigned to `portfolio_analyst`.
#     `portfolio_analytics` has been REMOVED from that role.
#   * `compliance_officer` held `audit` alongside full-value access, so an
#     audit read performed under that role bypassed the auditor's
#     `pointers_only` restriction. `audit` has been REMOVED from that role.
#     Audit is performed under `auditor` or `external_auditor`, and nowhere
#     else.
# =====================================================================
purposes:
  - id: relationship_management
    description: "Serving a client the principal is accountable for."
    validated_by: portfolio_assignment
    validation: "core_banking.party.primary_rm_code = :principal.rm_code for the named party"
  - id: credit_assessment
    description: "Underwriting, annual review, covenant monitoring."
    validated_by: assignment_or_open_review
    validation: "an open credit review or facility application naming the principal as analyst or approver"
  - id: portfolio_analytics
    description: "Aggregate risk and exposure analysis. No named-subject output, ever."
    validated_by: role_binding
    validation: "the active role declares aggregate_only: true"
  - id: financial_crime_compliance
    description: "Screening, investigation, regulatory reporting."
    validated_by: open_case
    validation: "an open financial-crime case id the principal is assigned to"
  - id: audit
    description: "Reconstructing what was decided and on what evidence. Pointers and verdicts, not values."
    validated_by: engagement
    validation: "an open audit engagement id the principal is named on"
  - id: model_development
    description: "Building and validating risk models. Pseudonymous features and aggregates only."
    validated_by: engagement
    validation: "an open model-development engagement id"
  - id: system_operation
    description: "Running the platform. Metadata, schema, health and banded counts -- never a value."
    validated_by: source_binding
    validation: "the machine principal's credential names the source it is bound to"

purpose_binding_rules:
  - "Purpose is an attribute of the PRINCIPAL for the duration of the request, not a free-form field the principal fills in."
  - "A purpose whose `validated_by` check fails is FORBIDDEN. It is never silently downgraded to a narrower purpose that would pass."
  - "Holding data lawfully for one purpose is not permission to use it for another. This is the whole point of D5."
  - "The role-level `purposes` list is a union, not a grant. `purpose_scoped_grants` is what a purpose actually reaches."
  - "A (role, purpose) pair with no entry in `purpose_scoped_grants` reaches NOTHING. Absence is a refusal, not a wildcard."

purpose_scoped_grants:
  # (role, purpose) -> the objects that purpose may reach within that role.
  # Anything the role allows but this table does not list for the declared
  # purpose is FORBIDDEN with POLICY_PURPOSE_MISMATCH.
  relationship_manager:
    relationship_management:
      objects: [core_banking.party, core_banking.party_address, core_banking.party_contact,
                core_banking.account, core_banking.facility, core_banking.facility_account,
                crm.relationship_manager, crm.account_org, crm.contact, crm.interaction,
                crm.opportunity]
      note: "servicing a client. No transaction detail, no covenant history, no collateral."
    credit_assessment:
      objects: [core_banking.party, core_banking.account, core_banking.facility,
                core_banking.facility_account, core_banking.account_balance_monthly,
                core_banking.txn, core_banking.collateral, core_banking.covenant,
                core_banking.covenant_test, filings.document, spreadsheets.covenant_tracker,
                spreadsheets.limit_utilisation]
      note: "an annual review reaches exposure and covenant history and does NOT reach CRM contact records or interaction history."
  senior_relationship_manager:
    relationship_management: {inherits: relationship_manager}
    credit_assessment: {inherits: relationship_manager}
  credit_analyst:
    credit_assessment:
      objects: [core_banking.party, core_banking.account, core_banking.facility,
                core_banking.facility_account, core_banking.txn,
                core_banking.account_balance_monthly, core_banking.collateral,
                core_banking.covenant, core_banking.covenant_test, crm.account_org,
                crm.opportunity, filings.document, spreadsheets.risk_model_pd_lgd,
                spreadsheets.covenant_tracker, spreadsheets.limit_utilisation,
                spreadsheets.exposure_summary_by_sector, payments.event,
                market_data.derived_aggregates]
  portfolio_analyst:
    portfolio_analytics:
      objects: [core_banking.party, core_banking.account, core_banking.facility,
                core_banking.txn, core_banking.account_balance_monthly,
                core_banking.collateral, core_banking.covenant, core_banking.covenant_test,
                crm.account_org, crm.opportunity, payments.event,
                market_data.derived_aggregates, spreadsheets.exposure_summary_by_sector,
                spreadsheets.limit_utilisation]
      output: aggregate_only
  compliance_officer:
    financial_crime_compliance:
      objects: ["*"]
      justification: >-
        A financial-crime investigation cannot declare its scope in advance --
        that is what an investigation is. The control here is not narrowing the
        object set; it is the open-case validation on the purpose, the per-read
        log, the four-eyes gate on bulk export, and the fact that the role is
        mutually exclusive with model_developer.
  model_developer:
    model_development:
      objects: [core_banking.account, core_banking.facility, core_banking.txn,
                core_banking.account_balance_monthly, core_banking.covenant,
                core_banking.covenant_test, market_data.derived_aggregates,
                spreadsheets.risk_model_pd_lgd, spreadsheets.exposure_summary_by_sector]
      output: pseudonymous_only
  auditor:
    audit: {objects: ["*"], output: pointers_and_verdicts_only}
  external_auditor:
    audit:
      objects: [core_banking.facility, core_banking.covenant, core_banking.covenant_test,
                core_banking.collateral, credit_memos.document]
      output: pointers_and_verdicts_only
  platform_operator:
    system_operation: {objects: ["*"], output: metadata_only}

# =====================================================================
# 4. THE PRINCIPAL'S OWN ATTRIBUTES
#
# Version 1's row filters read `:principal.rm_code`, `:principal.team` and
# `:principal.email` without saying where those come from. If they arrive on
# the request, every row filter in this file is decorative: a caller supplies
# another RM's code and receives their book.
# =====================================================================
principal_attributes:
  source: authenticated_credential
  rule: >-
    Every `:principal.*` attribute is bound at stage 2 from the WORKFORCE
    IDENTITY ASSERTION presented with the request -- an OIDC claim, an mTLS
    SAN, or an equivalent. None of them may be read from a request field, a
    header, a query parameter or a configuration file the calling process
    controls. A request that CARRIES a `:principal.*` value is FORBIDDEN with
    POLICY_UNATTESTED_PRINCIPAL_ATTRIBUTE, rather than having it ignored --
    ignoring it makes an attempted escalation invisible.
  attributes:
    rm_code:
      authoritative_source: "the workforce directory, joined to crm.relationship_manager.rm_code"
      pointer_required: true
      pointer_note: "the binding carries its own SourcePointer, so an audit can re-read which rm_code this principal held AT THE TIME of the read. rm_code is reissued after a leaver, so 'who was RM-007' is a temporal question."
      may_not_come_from: [crm.relationship_manager, "any request field"]
      may_not_come_from_note: >-
        Not even from `crm` itself: crm is a source this policy PROTECTS, and
        an attribute read out of a protected source to decide access to that
        source is circular. The directory is the authority; crm is where the
        code is USED.
    team:
      authoritative_source: "the workforce directory"
      pointer_required: true
    email:
      authoritative_source: "the workforce directory"
      pointer_required: true
      note: "not used in any row filter in this file. See `untrusted_fields_forbidden_in_predicates` and the mailbox entry."
    engagement_id:
      authoritative_source: "the audit/model engagement register"
      pointer_required: true
      note: "keys the per-engagement pseudonymisation key. Destroyed when the engagement closes."
    case_id:
      authoritative_source: "the financial-crime case register"
      pointer_required: true
  attribute_change_mid_read:
    rule: "attributes are bound ONCE per request and are immutable for its duration. A reassignment between page 1 and page 2 does not widen an in-flight read; the read completes on the bound values and the next request re-binds."
    status: NOT_EXERCISED_BY_THIS_FIXTURE

# =====================================================================
# 5. SUBJECT KIND AND THE IDENTITY GUARDRAIL (spine D4b)
# =====================================================================
subject_kinds:
  - kind: party
    ontology_kind: Party
    covers: [borrower, guarantor, counterparty, individual_customer, prospect, watchlist_subject]
    identifiers: [registration_no, national_id, passport, lei]
    identifier_note: >-
      Every one of these is partial. `registration_no` is NULL on the second
      copy of all 34 intra-source duplicate parties -- the strong key is missing
      exactly where it is needed -- and no identifier crosses a source boundary
      anywhere in this estate.
    not_identifiers:
      - {id: party_id, why: "identifies a ROW in core_banking, not a real-world entity. 34 pairs of rows are one entity."}
      - {id: crm_org_id, why: "identifies a row in crm."}
      - {id: account_no, why: "identifies an account, which one entity may hold many of."}
      - {id: legal_name, why: "the same company is spelled six ways and twelve distinct companies share near-identical names. See ground_truth/non_matches.csv."}
      - {id: contact_email, why: "role mailboxes (ops@, treasury@) are shared by several people. A shared key is not a key."}
    never_fuzzy_merge: true
    attestation: [in_person, verified_channel, registry_document]
    grant_type: PartyReadGrant

identity_guardrail:
  applies_to: [party]
  rule: >-
    The system presents CANDIDATES. A named human attests.
    `requires_human_selection` stays `Literal[True]`. There is no code path
    that sets it False. A pack that declares no subject kind gets NO
    identity-resolution capability at all.
  no_reliability_figure_confirms: >-
    A join reliability of 1.0 confirms nothing. Reliability is a property of a
    population; identity is a claim about one subject. See
    `sources.yaml: identity`.
  applies_to_screening_too: >-
    A watchlist candidate is not a finding. Only a named compliance officer's
    attestation makes it one, and only a named human may dismiss one.

# =====================================================================
# 6. THE RESULT MODEL -- withheld, absent, and the six other states
#
# Version 1 specified behaviour for a denied COLUMN and for nothing else.
# There was no defined answer for a denied source, a denied table, a
# row-filtered record, a record that does not exist, a source NULL, an expired
# capture, or a source that is down -- and an implementer facing an undefined
# case reaches for `None`, which collapses every one of them into `unresolved`.
#
# NOTE: this build emits three CELL types (`GroundedValue | Withheld |
# Absent`, spine D4). The states below are the RECORD-and-CELL dispositions
# expressed in those three plus a reason code -- deliberately NOT new cell
# types. Minting cell states in a fixture fragments the vocabulary the type
# exists to provide. The case for a fourth cell state is recorded in the
# disposition log, and is the same case the government estate raised.
# =====================================================================
result_model:
  cell_states:
    - {state: GroundedValue, meaning: "the value, with a SourcePointer that re-executes", in_unresolved: false}
    - {state: Withheld, meaning: "the value exists and policy stopped it. Carries a WithholdingRecord: field path, policy id, reason code, principal.", in_unresolved: false}
    - {state: Absent, meaning: "the source does not have it. Carries no pointer and no policy id.", in_unresolved: true}
  dispositions:
    - {case: denied_source, disposition: FORBIDDEN, level: request, reason: POLICY_SOURCE_DENIED,
       note: "the whole source. Not an empty result set -- an empty set is a claim about the data."}
    - {case: denied_table, disposition: FORBIDDEN, level: request, reason: POLICY_TABLE_DENIED}
    - {case: denied_column, disposition: Withheld, level: cell, reason: POLICY_COLUMN_DENIED}
    - {case: column_not_in_projection, disposition: Withheld, level: cell, reason: POLICY_DATA_MINIMIZATION}
    - {case: unclassified_column, disposition: Withheld, level: cell, reason: POLICY_UNCLASSIFIED_COLUMN}
    - {case: masked_column, disposition: Withheld, level: cell, reason: POLICY_MASKED, carries: transform_record}
    - {case: free_text_column, disposition: Withheld, level: cell, reason: POLICY_FREE_TEXT_UNREVIEWED}
    - {case: row_outside_scope_existence_disclosed, disposition: Withheld, level: row, reason: POLICY_PORTFOLIO_SCOPE}
    - {case: row_outside_scope_existence_not_disclosed, disposition: "identical to record_does_not_exist", level: row, reason: POLICY_SCOPE_UNDISCLOSED}
    - {case: record_does_not_exist, disposition: "empty result + constant scope declaration", level: row, reason: POLICY_SCOPE_UNDISCLOSED}
    - {case: source_null, disposition: Absent, level: cell, reason: null,
       note: "the source HAS the column and its value is NULL. Distinct from every policy state above and from a missing column. It goes in `unresolved`; the policy states do not."}
    - {case: source_empty_string, disposition: Absent, level: cell, reason: null,
       note: "this estate uses '' and NULL interchangeably for missing, on purpose. Both normalise to Absent, and the adapter records WHICH was found so the hazard stays visible."}
    - {case: capture_expired, disposition: "GroundedValue retained, verify() -> UNVERIFIABLE", level: pointer, reason: CAPTURE_EXPIRED}
    - {case: capture_vanished, disposition: "GroundedValue retained, verify() -> VANISHED", level: pointer, reason: SOURCE_GONE,
       note: "only reportable where deletes are detectable. Everywhere else the honest verdict is UNVERIFIABLE."}
    - {case: source_unavailable, disposition: "error, never a value and never Absent", level: request, reason: SOURCE_UNAVAILABLE,
       note: "a source that is down must not degrade into `unresolved`. 'We could not ask' and 'there is nothing there' are different answers and only one of them is safe to build on."}
  provenance_of_policy_output:
    rule: >-
      Every withheld marker, every transform record, every count, every policy
      decision and every derived aggregate carries a RE-EXECUTABLE pointer of
      its own -- to the policy bundle version, the rule id and the principal
      context that produced it. A policy decision is evidence about the system,
      and evidence without a pointer is exactly what this design exists to
      refuse.
    pointer_kind: policy_decision
    not_a_source_pointer: "it cites the POLICY, not the data. A masked value's transform record additionally carries a `derived` pointer to the span it was computed FROM -- never to the string emitted, which appears nowhere in any source."

# =====================================================================
# 7. EXISTENCE DISCLOSURE
#
# Version 1's `own_portfolio_only` case promised that "the response states
# that N rows were withheld by the portfolio rule". That count is the leak: it
# discloses how many clients other RMs hold, and repeating the query with
# predicates turns it into a population-count oracle -- probe a name, and a
# non-zero withheld count tells you the bank banks them.
#
# Three states, not two, and portfolio isolation defaults to the third.
# =====================================================================
existence_disclosure:
  states:
    disclosed:
      meaning: "the object exists, the principal may know it exists, and its fields are readable subject to column policy"
    contents_withheld:
      meaning: "the object exists, the principal is TOLD it exists, and its contents are withheld with a reason code"
      when: "a deliberate choice, made where the existence is already known to the principal by another lawful route"
      used_by: [external_auditor_scope, credit_analyst_free_text]
    existence_not_disclosed:
      meaning: "the principal may not learn whether the object exists"
      requirement: >-
        A request for an out-of-scope object and a request for an object that
        does not exist MUST return byte-identical responses: same reason code
        (POLICY_SCOPE_UNDISCLOSED), same shape, no count, no key, no field
        path, and no timing difference that separates the two. Anything else
        turns the refusal into an oracle and lets a caller enumerate the bank's
        client list by probing names.
      default_for: [portfolio_isolation, role_scope_denial, unbound_document_scope]
  scope_declaration:
    rule: >-
      A response over an `existence_not_disclosed` object carries a CONSTANT
      scope declaration -- "this response is limited to your portfolio", policy
      id and reason code attached -- and NEVER a count of what was excluded. A
      count is cardinality and cardinality is the leak.
  relation_to_D4: >-
    D4's "withheld is distinguishable from absent" is a FIELD-level guarantee
    and it holds once the principal is authorised to know the object exists. At
    OBJECT level, distinguishing withheld from absent is sometimes itself the
    leak. Applying D4 uniformly at object level would make every portfolio
    boundary enumerable one refusal at a time. This tension is a gap in D4 as
    written; the government estate reached the same conclusion independently
    and both are recorded in the disposition logs.
  counts_and_aggregates:
    rule: "a count is a disclosure. Counts over an existence_not_disclosed object are refused; counts elsewhere obey `aggregate_policy` including the small-cell threshold."

# =====================================================================
# 8. REASON CODES. Closed set: a withholding with no code in this list is a
# bug, not a policy.
# =====================================================================
reason_codes:
  POLICY_NO_ACTIVE_CONTEXT: "the request named no valid role context"
  POLICY_UNATTESTED_PRINCIPAL_ATTRIBUTE: "a :principal.* value arrived on the request instead of from the credential"
  POLICY_PURPOSE_MISMATCH: "the declared purpose does not cover this role, this object, or both"
  POLICY_GRANT_EXPIRED: "the role's expires_on has passed, or a precondition obligation is unmet"
  POLICY_SOURCE_DENIED: "the whole source is denied to this role"
  POLICY_TABLE_DENIED: "the object is denied to this role"
  POLICY_COLUMN_DENIED: "the column is denied to this role"
  POLICY_ROLE_SCOPE: "the object is outside this role's allow list"
  POLICY_EGRESS_CEILING: "the object's egress class exceeds this role's ceiling"
  LICENCE_ROW_EGRESS: "licensed vendor rows may not be redistributed; only a declared derived aggregate may leave"
  POLICY_ROW_SCOPE_UNDECLARED: "the object is allowed but declares no row scope. Fails closed."
  POLICY_ROW_SCOPE_UNCOMPILABLE: "the row scope is declared but this build's predicate compiler cannot express it. Fails closed; see `row_scope_compilation`."
  POLICY_PORTFOLIO_SCOPE: "the row is outside this principal's portfolio, and the principal is already authorised to know the row exists"
  POLICY_SCOPE_UNDISCLOSED: "if such a record exists, this principal is not authorised to know. Emitted identically for out-of-scope and non-existent."
  POLICY_DATA_MINIMIZATION: "the column is not within the minimum necessary for this purpose"
  POLICY_UNCLASSIFIED_COLUMN: "the column is in neither the projection nor column_classification: an unreviewed schema addition. Fails closed."
  POLICY_FREE_TEXT_UNREVIEWED: "unstructured text that no column-level rule can inspect"
  POLICY_MASKED: "disclosed in transformed form only. Carries a transform record; not a grounded value."
  POLICY_THIRD_PARTY_DATA: "personal data of a person other than the subject of the read"
  POLICY_INFERENCE_CONTROL: "individually innocuous, re-identifying in combination with what this role already sees"
  POLICY_SMALL_CELL: "aggregate below the small-cell threshold, or suppressed complementarily"
  POLICY_QUERY_SURFACE: "the aggregate requested is not on the approved query surface"
  POLICY_QUERY_BUDGET: "the per-principal, per-projection query budget is exhausted"
  POLICY_UNTRUSTED_PREDICATE: "the requested filter names a field that may not influence control flow (D3)"
  POLICY_UNBOUND_DOCUMENT: "the document has no trusted binding to a facility or a party; only its claimed one"
  POLICY_ORPHAN_ROW: "the row's parent reference does not resolve, so no portfolio scope can be established for it. Fails closed."
  CAPTURE_EXPIRED: "the capture is past its retention; the citation can no longer be re-checked"
  SOURCE_GONE: "the source object no longer exists, on a source where deletes are detectable"
  SOURCE_UNAVAILABLE: "the source could not be reached. Never a value and never Absent."

# =====================================================================
# 9. UNTRUSTED FIELDS MAY NOT DECIDE ACCESS (spine D3)
#
# Version 1 scoped `credit_memos` on `document.relationship_manager_code` --
# a value printed INSIDE an untrusted document -- and scoped `mailbox` on
# `header.From` / `header.To`, which the sender writes. Both let the author of
# a document choose who may read it, and one of them (mailbox) also let them
# choose whose portfolio it landed in. That is untrusted input deciding control
# flow, which D3 forbids, and the estate was MODELLING the forbidden flow
# rather than testing it.
# =====================================================================
untrusted_fields_forbidden_in_predicates:
  enforcement: "the policy loader REJECTS any row filter whose predicate names one of these. Runtime returns POLICY_UNTRUSTED_PREDICATE."
  fields:
    - credit_memos.document.claimed_facility_reference
    - credit_memos.document.claimed_relationship_manager_code
    - credit_memos.document.claimed_borrower_name
    - mailbox.message.claimed_from_address
    - mailbox.message.claimed_to_addresses
    - mailbox.message.claimed_thread_refs
    - mailbox.message.subject
    - mailbox.message.body
    - mailbox.message.attachment
    - filings.document.text
    - core_banking.party.notes
    - core_banking.facility.notes
    - core_banking.collateral.notes
    - core_banking.collateral.description
    - core_banking.txn.narrative
    - core_banking.txn.counterparty_name
    - crm.interaction.summary
    - crm.interaction.subject
    - crm.opportunity.lost_reason
    - crm.account_org.external_ref
    - payments.event.remittance_info
    - payments.debtor.name_as_instructed
    - payments.creditor.name_as_instructed
    - spreadsheets.risk_model_pd_lgd.model_owner_comment
    - spreadsheets.risk_model_pd_lgd.borrower_name
    - spreadsheets.exposure_summary_by_sector.note
    - spreadsheets.covenant_tracker.borrower
    - market_data.instruments.issuer_name_as_reported
  note_on_external_ref: >-
    `crm.account_org.external_ref` is first-party data in a first-party table
    and it is still here, because it is 20% WRONG. A predicate over it attaches
    one company's exposure to another company's relationship file, which is the
    same failure as a forged header arriving at the same place by a different
    road.

trusted_bindings:
  # What MAY decide access. Each is either bank-produced or human-attested.
  credit_memos:
    binds: "document -> facility"
    established_by:
      - {id: document_intake_register, rule: "the memo was registered against a facility by the officer who filed it", status: NOT_PRESENT_IN_THIS_FIXTURE}
      - {id: human_attestation, rule: "a named officer binds the memo to a facility; principal and timestamp recorded"}
    until_established: "the memo is outside every portfolio scope. Reachable only by `compliance_officer`, which holds the unbound-document triage grant."
  mailbox:
    binds: "message -> client or facility"
    established_by:
      - {id: delivered_to_account, rule: "an AUTHENTICATED mailbox identity supplied by the extractor, compared by exact normalised address match", status: NOT_PRESENT_IN_THIS_FIXTURE}
      - {id: human_attestation, rule: "a named officer binds the message; principal and timestamp recorded"}
    until_established: "the mailbox is not row-scopable and is compliance-only."
  payments:
    binds: "event -> account"
    established_by:
      - {id: normalised_account_ref, rule: "format normalisation produces a CANDIDATE only; a non-injective normalisation must report its collisions", status: candidate_only}
      - {id: human_attestation, rule: "a named officer confirms the account association"}
    until_established: "the event is readable as an event and is not attributed to a party."

# =====================================================================
# 10. ROW SCOPE -- completeness, and what this build can actually compile
#
# Review Critical 1: version 1 filtered `party`, `account`, `facility` and
# `txn`, and granted `party_address`, `party_contact`, `facility_account`,
# `account_balance_monthly`, `collateral`, `covenant` and `covenant_test`
# UNFILTERED. A direct query of `party_contact` or `collateral` walked
# straight around the portfolio boundary. The engine cannot be asked to infer
# propagation, because the relationships it would have to propagate through
# are undeclared and 6-11% orphaned.
# =====================================================================
row_scope_completeness:
  rule: >-
    EVERY object in a role's `allow` must appear in EITHER that role's
    `row_filters` OR its `unscoped_objects` list. An object in neither is a
    POLICY LOADER ERROR, and at runtime fails closed with
    POLICY_ROW_SCOPE_UNDECLARED. There is no default scope, and "the client
    will join through a filtered parent" is not a policy.
  unscoped_requires_justification: true
  no_inferred_propagation: >-
    A row scope is never inferred from a foreign key. Four of the
    relationships that would carry portfolio scope in this estate are
    UNDECLARED FKs with 6-11% orphans (`txn.counterparty_party_id`,
    `txn.reversal_of`, `collateral.facility_id`, `party.primary_rm_code`).
    Propagating a boundary through them would leak on exactly the orphans, and
    the orphans are the rows nobody checks.
  orphan_rule:
    disposition: existence_not_disclosed
    reason: POLICY_ORPHAN_ROW
    rule: >-
      A row whose scoping parent reference does not resolve has NO portfolio
      and fails closed for every portfolio-scoped role. It is reachable only by
      `compliance_officer`. ~6% of `collateral` rows are in this state by
      construction, and they are the single most likely place for this estate
      to leak.

row_scope_compilation:
  # This is a limitation of the BUILD, declared so that it is visible rather
  # than discovered. ADAPTER_AGENT_SPEC §6 leaves the portable predicate
  # grammar undefined (Appendix A calls it the highest-risk undefined
  # component), so the Policy layer compiles exactly two shapes today.
  compilable:
    - "<column> = :principal.<attr>"
    - "<column> IN (SELECT <col> FROM <schema>.<table> WHERE <col> = :principal.<attr>)"
  not_compilable:
    - "a two-hop scope: <column> IN (SELECT ... FROM ... WHERE ... IN (SELECT ...))"
  on_uncompilable: refuse
  on_uncompilable_note: >-
    A row scope this build cannot compile is REFUSED at admission with
    POLICY_ROW_SCOPE_UNCOMPILABLE. It is never dropped and the object is never
    served unfiltered. A row rule that silently does not run is the exact shape
    of a policy that permits everything while appearing not to.
  consequence: >-
    Seven objects in this file carry a correct two-hop portfolio scope that
    this build cannot yet compile, so they are currently unreadable by
    portfolio-scoped roles: core_banking.txn, core_banking.facility_account,
    core_banking.account_balance_monthly, core_banking.collateral,
    core_banking.covenant, core_banking.covenant_test and
    spreadsheets.limit_utilisation. That is the correct answer, not a
    regression: version 1 served all seven WITHOUT a scope.
  unblocked_by:
    - "the §6 predicate grammar, with a closed grammar, an identifier allowlist and per-dialect conformance tests"
    - "or a bank-side scoping view per named scope below, which turns every two-hop scope into a one-hop one"

scopes:
  # Named scopes, so a relationship filter is written once and cannot be
  # forgotten. `definition` is the semantics; `view` names the scoping view
  # that would make it compilable today.
  "@rm.my_parties":
    returns: party_id
    definition: "SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code"
    compilable: true
  "@rm.my_accounts":
    returns: account_id
    definition: "SELECT account_id FROM core_banking.account WHERE party_id IN @rm.my_parties"
    compilable: false
    view: core_banking.v_rm_accounts
  "@rm.my_facilities":
    returns: facility_id
    definition: "SELECT facility_id FROM core_banking.facility WHERE party_id IN @rm.my_parties"
    compilable: false
    view: core_banking.v_rm_facilities
  "@rm.my_covenants":
    returns: covenant_id
    definition: "SELECT covenant_id FROM core_banking.covenant WHERE facility_id IN @rm.my_facilities"
    compilable: false
    view: core_banking.v_rm_covenants
  "@team.parties":
    returns: party_id
    definition: "SELECT party_id FROM core_banking.party WHERE primary_rm_code IN (SELECT rm_code FROM crm.relationship_manager WHERE team = :principal.team)"
    compilable: false
    view: core_banking.v_team_parties
  "@audit.scope_2026":
    returns: facility_id
    definition: "SELECT facility_id FROM audit_scope_2026"
    compilable: true

named_row_sets:
  # Review: `audit_scope_2026` was referenced by a predicate and declared
  # nowhere.
  audit_scope_2026:
    kind: bank_maintained_scope_table
    columns: [facility_id, engagement_id, added_by, added_at, removed_at]
    maintained_by: "the bank's audit liaison, not the audit firm"
    maintained_by_note: "an outside firm that can add to its own scope table has no scope. Additions are a bank-side change with a named approver."
    trust_class: trusted
    contents: "facility_ids in scope for the 2026 external audit engagement"
    row_semantics: "a row with `removed_at` set is out of scope from that instant. The predicate reads only rows where removed_at IS NULL."
    status: NOT_PRESENT_IN_THIS_FIXTURE
    status_note: "the table is declared here so the predicate has a vocabulary to bind to; the fixture ships no rows for it, so external_auditor reads nothing until it does. Fails closed, which is the right way round."

# =====================================================================
# 11. FREE TEXT
#
# Review Critical 2: the advertised compliance-only boundary was false. The RM
# was granted `crm.interaction` and the whole `mailbox` with no denial of
# `interaction.summary`, message bodies or attachments; the credit analyst
# received `facility.notes`, `collateral.notes`, `txn.narrative`,
# `payments.remittance_info` and unrestricted credit memos. The preamble and
# `compliance_officer.notes` both claimed those surfaces were readable "HERE
# AND NOWHERE ELSE", and neither the grants nor the classification enforced it.
#
# `column_classification` was descriptive. It is now the input to a
# DEFAULT-DENY rule.
# =====================================================================
free_text_policy:
  default: withheld
  default_reason: POLICY_FREE_TEXT_UNREVIEWED
  rule: >-
    Every column in `column_classification.free_text_may_contain_personal_data`
    is WITHHELD from every role by default, regardless of any grant over the
    table that contains it, and regardless of any sensitivity label beside it.
    Access is by named exception only, and there is exactly one exception in
    this estate.
  exceptions:
    - {role: compliance_officer, purposes: [financial_crime_compliance], columns: "all free text",
       condition: "an open financial-crime case id", obligation: no_export_of_free_text_outside_case_file}
  why_a_label_is_not_enough: >-
    462 pieces of personal data are planted inside these columns and no
    column-level rule can see them, because there are no columns inside a
    paragraph. A column-level policy that denies `party.date_of_birth` and then
    hands over `party.notes` containing the same date of birth in prose has
    denied nothing. See ground_truth/pii_in_free_text.csv.
  derived_summary_alternative:
    available_to: [relationship_manager, senior_relationship_manager, credit_analyst]
    emits: classify_only
    is_not_evidence: "a classification is a DERIVED assertion about the text. It is a Withheld cell carrying a transform record, never a GroundedValue, and it may not be cited as evidence of anything the text says."
  document_free_text:
    note: >-
      `filings` and `credit_memos` are free text end to end
      (`untrusted_fields: ["*"]`). They are not covered by a column rule
      because they have no columns; they are covered by the object grants and
      by `trusted_bindings`. A document is read as a whole or not at all.

# =====================================================================
# 12. MASKS AND TRANSFORMS
#
# Review: "The mask definitions contain literal example outputs -- 1979,
# ****1234, 50-250M -- instead of deterministic transformations. An engineer
# could implement them as constants, creating fabricated values without valid
# provenance." `emit` is now a TRANSFORM SPECIFICATION; `example` is separate
# and is documentation.
#
# A masked value is not a grounded value: the emitted string does not appear
# in the source and cannot pass the grounding wall. It is not an absent value
# either. Every mask therefore emits a Withheld cell carrying a transform
# record, so no reader and no downstream join can mistake it for evidence.
# =====================================================================
masks:
  redact:
    emit: "constant('[WITHHELD]')"
    example: "[WITHHELD]"
    cell_type: Withheld
    reason: POLICY_COLUMN_DENIED
    note: "full redaction. Discloses nothing but that the column exists and was refused."
  pseudonym_engagement:
    emit: "'PSN-' + hmac_sha256(value, engagement_key)[:10]"
    example: "PSN-3f9a1c7d02"
    cell_type: Withheld
    reason: POLICY_MASKED
    stable_within: engagement
    stable_across: never
    key_lifecycle: "the key lives with the engagement record and is DESTROYED when the engagement closes. A pseudonym outliving its key is a permanent join key."
    note: >-
      Join-preserving inside one engagement so a process can be traced, and not
      correlatable across engagements or against any other dataset. Replaces
      version 1's `hash`, whose per-subject key was stable forever and
      therefore preserved linkage against every past and future extract.
    is_not_deidentification: >-
      A stable pseudonym over a borrower NAME is not de-identification: the
      name distribution is public, frequencies are skewed, and a dictionary of
      candidate names inverts it. That is why no borrower name is pseudonymised
      anywhere in this file -- names are WITHHELD, and only opaque row
      identifiers are pseudonymised.
  year_only:
    emit: "year(value)"
    example: "1979"
    cell_type: Withheld
    reason: POLICY_MASKED
    input_type: date
    output_format: YYYY
    note: "deterministic on the source date. Not a constant, not a bucket, not a jitter."
    residual: "a birth year plus a name plus a country is frequently re-identifying. This mask is applied to NO column in this file; it is retained as a declared transform so a future grant that wants it must name it here."
  last4:
    emit: "'*' * (len(normalise(value)) - 4) + normalise(value)[-4:]"
    example: "********1234"
    cell_type: Withheld
    reason: POLICY_MASKED
    normalise: "strip separators and whitespace before taking the tail, so the same account is masked identically however it was formatted"
    note: "the mask length follows the value length, so it is deterministic. A fixed-width example would have hidden that."
    residual: "the last four digits of an account are a stable partial identifier and a join key across sources. Applied only where the purpose genuinely needs to distinguish two accounts of one party."
  band:
    emit: "band(value, boundaries)"
    example: "50-250M"
    cell_type: Withheld
    reason: POLICY_MASKED
    boundaries: [0, 1000000, 10000000, 50000000, 250000000, 1000000000]
    boundary_units: "the value's own currency, unconverted. A converted band would be a derived number with no source."
    open_ended: "the top band is '>1B' and the bottom is '<1M'; there is no unbounded band, because an unbounded band on a small population is a single subject."
    note: "boundaries are fixed and declared. Data-dependent boundaries (quantiles) leak the distribution and change between runs."
  month_only:
    emit: "format(value, 'YYYY-MM')"
    example: "2026-08"
    cell_type: Withheld
    reason: POLICY_MASKED
    note: "an exact timestamp plus a facility id re-identifies against the credit file; the month does not."
  classify_only:
    emit: "classify(text) -> {has_personal_data: bool, categories: sorted_set}"
    example: "{has_personal_data: true, categories: [national_id, phone]}"
    cell_type: Withheld
    reason: POLICY_FREE_TEXT_UNREVIEWED
    note: "a classification OF the text, never the text."
    length_removed: >-
      Version 1 also emitted `length: 214`. Text length is a fingerprint: it
      distinguishes two notes, tracks edits over time, and correlates with what
      the note is about. Removed.
    residual_disclosure: >-
      This mask still discloses that the field is non-empty and what KINDS of
      personal data it holds. That is a real disclosure, declared rather than
      hidden, and it is why the classification is available to three roles and
      not to all of them.

# =====================================================================
# 13. AGGREGATE POLICY
#
# Review: "a minimum group size of five is insufficient without subject
# definition, allowed grouping dimensions, query-history controls, and
# protection against overlapping aggregates." All four, plus the two the review
# implied: no published margins, and complementary suppression.
# =====================================================================
aggregate_policy:
  applies_to_roles: [portfolio_analyst, model_developer]
  subject_definition:
    counted_unit: canonical_party
    rule: >-
      The small-cell threshold counts DISTINCT SUBJECTS, not rows. One
      borrower with four facilities is ONE contributing subject. Counting rows
      would let a four-facility borrower satisfy a threshold of five on its
      own, which is the failure the threshold exists to prevent -- and this
      estate makes it concrete: 34 party rows are duplicates of another party
      row, so even a distinct-party_id count is wrong. The unit is the resolved
      entity, and where resolution is uncertain the aggregate is REFUSED rather
      than computed on a guess.
  approved_query_surface: fixed
  approved_query_surface_note: >-
    Only the projections below may be requested. Free-form predicates over an
    aggregate object are refused with POLICY_QUERY_SURFACE. A fixed surface is
    what makes differencing analysable at all -- with arbitrary predicates no
    threshold is defensible.
  approved_projections:
    - {id: exposure_by_sector_month, group_by: [sector, as_of_month], measures: [limit_total, drawn_total, borrower_count]}
    - {id: exposure_by_risk_grade_month, group_by: [risk_grade, as_of_month], measures: [limit_total, drawn_total, borrower_count]}
    - {id: covenant_breach_rate_by_type_quarter, group_by: [covenant_type, as_of_quarter], measures: [tests_run, breaches]}
    - {id: pd_lgd_distribution_by_segment, group_by: [segment], measures: [mean_pd, mean_lgd, borrower_count]}
  allowed_grouping_dimensions: [sector, risk_grade, covenant_type, segment, as_of_month, as_of_quarter, currency]
  forbidden_grouping_dimensions: [party_id, legal_name, registration_no, country_code, primary_rm_code, branch_code, account_no, facility_id]
  forbidden_grouping_note: >-
    `primary_rm_code` and `branch_code` look like process metadata and are not:
    an RM's book is a small, named set of borrowers, so grouping by RM is
    grouping by a handful of identifiable companies.
  cohort_rule: >-
    Cohorts are fixed and non-overlapping within a projection. Adjacent periods
    may not be re-cut on request; a re-cut boundary is a difference query
    wearing a different hat.
  small_cell_threshold: 5
  on_small_cell: refuse
  on_small_cell_note: >-
    Refused, never rounded and never perturbed. A perturbed value does not
    appear in the source and would break the grounding wall. Confine any
    epsilon to declared aggregates re-typed as `derived` pointers carrying it
    (spine D8).
  dominance_rule:
    enabled: true
    rule: "a cell is also suppressed when one subject contributes more than 40% of the measure, or two subjects contribute more than 60%. Five subjects one of which is 95% of the total is a disclosure of that subject."
  complementary_suppression:
    enabled: true
    rule: "when a cell is suppressed, suppress the next-smallest cell in the same row AND the same column, and recurse until no margin identifies a single suppressed cell."
  margins_published: false
  margins_note: "totals are NOT published alongside suppressed cells. A total plus n-1 cells IS the nth cell."
  query_budget:
    per: [principal, projection]
    window: P1D
    max_queries: 20
    on_exhausted: {verdict: FORBIDDEN, reason: POLICY_QUERY_BUDGET}
    note: >-
      A blunt instrument, and declared as one. It bounds repeated-query
      differencing; it is NOT a privacy budget and must not be described as
      one. A formal epsilon mechanism is deliberately not built here.
  residual_risk_declared: >-
    A fixed surface, complementary suppression, a dominance rule, no margins
    and a query cap bound the obvious differencing attacks. They do not
    eliminate inference from external knowledge -- an analyst who already knows
    one borrower's sector learns something from a cell of five. That residual
    is accepted and stated rather than hidden behind a threshold number.

# =====================================================================
# 13a. THE TRANSFORMED-READ GAP -- declared, not resolved
#
# `egress_ceiling` is ONE SCALAR PER ROLE, and it is compared against the bytes
# a read would actually disclose. That works at both extremes and has no
# expression for the middle:
#
#   * `auditor` and `platform_operator` disclose NOTHING, so no byte of a
#     RESTRICTED_INTERNAL source leaves and an INTERNAL ceiling is satisfied;
#   * `relationship_manager` and `credit_analyst` disclose raw values and carry
#     a RESTRICTED_INTERNAL ceiling to match.
#
# `portfolio_analyst` and `model_developer` are neither. Both are INTERNAL
# ceilings that must read a RESTRICTED_INTERNAL source in TRANSFORMED form --
# pseudonymised identifiers, banded amounts, month-generalised dates, aggregates
# above a threshold. Under a single scalar ceiling that read is refused outright
# the moment ANY column is disclosed, so today these two roles reach no byte of
# core_banking at all.
#
# That refusal is the SAFE direction and it is left standing. It is recorded
# here rather than fixed by raising either ceiling to RESTRICTED_INTERNAL, which
# would hand an aggregate-only and a pseudonymous-only role the same egress
# authority as a relationship manager in order to work around a modelling gap.
# =====================================================================
transformed_read_gap:
  affects: [portfolio_analyst, model_developer]
  symptom: "an INTERNAL-ceiling role that must read a RESTRICTED_INTERNAL source in transformed form is refused entirely, because the ceiling is compared per-read rather than per-output-form."
  not_resolved_by: "raising the ceiling. A ceiling is authority over bytes leaving; these roles need LESS authority over more objects, which a single scalar cannot say."
  resolution_shape: >-
    The same one `market_data` already uses: a DECLARED DERIVED OBJECT with its
    own egress class and its own qualifying conditions
    (`sources.yaml: market_data.derived_egress`). A pseudonymised feature table
    and a suppressed aggregate are derived objects, not projections of a source,
    and their egress class is a property of the transform rather than of the
    table they were computed from.
  required_to_close:
    - "a `derived_object` declaration per source, with an egress class and the conditions under which a projection qualifies as one"
    - "a `derived` pointer type that cites the transform and its inputs, so the output is still evidence-bearing"
    - "an egress comparison over the DERIVED object's class, not the source's"
  interim_behaviour: "FORBIDDEN, POLICY_EGRESS_CEILING. No value, no partial disclosure, no silently raised ceiling."

# =====================================================================
# 14. OBLIGATIONS -- as state machines, not adjectives
#
# Review: "obligations such as four-eyes approval and expiry lack fail-closed
# state machines, approval pointers, timezone, and inclusive/exclusive expiry
# semantics."
# =====================================================================
obligation_specs:
  log_every_read_with_purpose:
    kind: consequence
    states: [pending, appended]
    rule: "the ledger entry is appended BEFORE the value returns (D4a). A read whose ledger append fails RETURNS NOTHING; it does not return the value and log later."
    ledger: append_only
    records: [principal, role_context, purpose, purpose_validation_basis, object, row_disposition, withholdings, transforms, policy_bundle_version, timestamp]
  four_eyes_on_bulk_export:
    kind: precondition
    threshold: "any export of more than 100 rows, or any export of a free-text column at all"
    states: [not_requested, requested, approved, rejected, expired, executed]
    initial: not_requested
    transitions:
      - {from: not_requested, to: requested, by: requesting_principal}
      - {from: requested, to: approved, by: approving_principal, guard: "approving_principal != requesting_principal AND approving_principal holds compliance_officer"}
      - {from: requested, to: rejected, by: approving_principal}
      - {from: requested, to: expired, after: PT24H}
      - {from: approved, to: expired, after: PT1H, note: "an approval is a permission to act now, not a standing licence"}
      - {from: approved, to: executed, by: requesting_principal, once: true}
    fail_closed: "any state other than `approved` refuses the export. There is no timeout-to-approved and no default."
    approval_pointer_required: true
    approval_pointer_note: "the approval carries its own SourcePointer -- approver, timestamp, the exact request hash approved. An approval that does not name what it approved is not an approval."
    replay_protection: "`once: true` -- an approval is consumed by the export it authorised. A second export re-requests."
  no_export_of_free_text_outside_case_file:
    kind: consequence
    rule: "free text read under an open case may be written only to that case file. Export elsewhere is refused, and the case id is recorded on the read so the constraint can be checked after the fact."
  watermark_every_export:
    kind: consequence
    rule: "every exported artefact carries the principal, engagement id, timestamp and policy bundle version, in the artefact rather than in a covering email."
  expire_grant:
    kind: precondition
    timezone: Asia/Singapore
    boundary: inclusive_of_the_named_day
    rule: >-
      `expires_on: 2026-11-30` means the grant is live through
      2026-11-30T23:59:59+08:00 and refuses from 2026-12-01T00:00:00+08:00.
      Evaluated against the SERVER's clock in the declared zone, never the
      caller's. A date with no zone is two different instants sixteen hours
      apart, and the sixteen hours would be silent.
    on_expiry: {verdict: FORBIDDEN, reason: POLICY_GRANT_EXPIRED}
    no_grace: "there is no grace period and no warning window that keeps serving. An expiring engagement extends the grant explicitly or stops reading."

# =====================================================================
# 15. ROLES
#
# `allow` maps source id -> the entities of that source the role may reach.
# Entity names are the closed vocabulary declared in sources.yaml `streams`
# plus the document/message entities named below. A name that is not in that
# vocabulary is a POLICY LOADER ERROR -- version 1 put a TABLE
# (`core_banking.party`) into `deny_sources`, which a closed-vocabulary
# validator should have rejected.
# =====================================================================
roles:

  # -------------------------------------------------------------------
  relationship_manager:
    description: >-
      Owns a portfolio. Sees their own clients, and everyone else's not at all
      -- and "not at all" now means their existence is not disclosed either,
      because a withheld-row count over a client list is a client list.
    purposes: [relationship_management, credit_assessment]
    egress_ceiling: RESTRICTED_INTERNAL
    binds_to: crm.relationship_manager.rm_code
    row_filters:
      # -- one-hop scopes, compilable today --
      core_banking.party: "primary_rm_code = :principal.rm_code"
      core_banking.account: "party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code)"
      core_banking.facility: "party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code)"
      core_banking.party_address: "party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code)"
      core_banking.party_contact: "party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code)"
      crm.relationship_manager: "rm_code = :principal.rm_code"
      crm.account_org: "owner_rm_code = :principal.rm_code"
      crm.interaction: "rm_code = :principal.rm_code"
      crm.opportunity: "owner_rm_code = :principal.rm_code"
      crm.contact: "crm_org_id IN (SELECT crm_org_id FROM crm.account_org WHERE owner_rm_code = :principal.rm_code)"
      # -- two-hop scopes: CORRECT, and not compilable by this build. They are
      #    refused at admission (POLICY_ROW_SCOPE_UNCOMPILABLE), never served
      #    unfiltered. See `row_scope_compilation`. --
      core_banking.facility_account: "facility_id IN (SELECT facility_id FROM core_banking.facility WHERE party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code))"
      core_banking.account_balance_monthly: "account_id IN (SELECT account_id FROM core_banking.account WHERE party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code))"
      core_banking.txn: "account_id IN (SELECT account_id FROM core_banking.account WHERE party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code))"
      core_banking.collateral: "facility_id IN (SELECT facility_id FROM core_banking.facility WHERE party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code))"
      core_banking.covenant: "facility_id IN (SELECT facility_id FROM core_banking.facility WHERE party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code))"
      core_banking.covenant_test: "covenant_id IN (SELECT covenant_id FROM core_banking.covenant WHERE facility_id IN (SELECT facility_id FROM core_banking.facility WHERE party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code)))"
      spreadsheets.covenant_tracker: "facility_id IN (SELECT facility_id FROM core_banking.facility WHERE party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code))"
      spreadsheets.limit_utilisation: "facility_id IN (SELECT facility_id FROM core_banking.facility WHERE party_id IN (SELECT party_id FROM core_banking.party WHERE primary_rm_code = :principal.rm_code))"
    unscoped_objects:
      - object: filings.document
        justification: >-
          An annual report is a document the entity itself published. Holding
          one is not a disclosure about the banking relationship, and scoping
          published accounts to a portfolio would be theatre. The egress class
          (INTERNAL) and the free-text policy still apply.
    row_disposition:
      default: existence_not_disclosed
      default_reason: POLICY_SCOPE_UNDISCLOSED
      note: "another RM's client list is not disclosable as a count. See `existence_disclosure`."
    allow:
      core_banking: [party, party_address, party_contact, account, facility, facility_account,
                     txn, account_balance_monthly, collateral, covenant, covenant_test]
      crm: [relationship_manager, account_org, contact, interaction, opportunity]
      filings: [document]
      spreadsheets: [covenant_tracker, limit_utilisation]
    deny_columns:
      - crm.relationship_manager.email
      # Free text. Every one of these is compliance-only; version 1 denied
      # exactly one of them.
      - core_banking.party.notes
      - core_banking.facility.notes
      - core_banking.collateral.notes
      - core_banking.collateral.description
      - core_banking.txn.narrative
      - core_banking.txn.counterparty_name
      - crm.interaction.summary
      - crm.interaction.subject
      - crm.opportunity.lost_reason
      - spreadsheets.risk_model_pd_lgd.model_owner_comment
      # Direct identifiers of a natural person. Denied outright rather than
      # masked: version 1 both denied AND year-masked date_of_birth, and the
      # precedence between the two was undefined.
      - core_banking.party.date_of_birth
      # Unreliable bridge column: 20% wrong, and a wrong attach puts one
      # company's exposure on another company's file.
      - crm.account_org.external_ref
    column_masks: {}
    deny_sources: [mailbox, credit_memos, payments, market_data, sanctions_watchlist]
    deny_sources_note: >-
      Version 1 granted this role `mailbox: ["*"]`, `credit_memos: ["*"]` and
      `payments: ["*"]`. Mailbox and credit_memos are removed because neither
      has a trusted binding in this fixture, so scoping them would depend on a
      forgeable header or on text printed inside the document itself.
      market_data rows are licensed and above this role's ceiling anyway;
      naming the denial makes the refusal legible instead of incidental.
    obligations: [log_every_read_with_purpose]
    notes: >-
      An RM may see the personal data of their own clients' CONTACTS because
      they correspond with them. They may not see any free-text column: that is
      where colleagues record third-party information and suspicion, where 462
      pieces of personal data are planted, and where a column-level rule sees
      nothing at all.

  # -------------------------------------------------------------------
  senior_relationship_manager:
    extends: relationship_manager
    description: >-
      Sees the whole team's portfolio. Every widened scope is RESTATED here
      rather than inherited, so the widening is visible in the diff -- and a
      scope that is NOT restated stays at the narrower own-book rule.
    purposes: [relationship_management, credit_assessment]
    egress_ceiling: RESTRICTED_INTERNAL
    row_filters:
      core_banking.party: "primary_rm_code IN (SELECT rm_code FROM crm.relationship_manager WHERE team = :principal.team)"
      crm.relationship_manager: "team = :principal.team"
      crm.account_org: "owner_rm_code IN (SELECT rm_code FROM crm.relationship_manager WHERE team = :principal.team)"
      crm.interaction: "rm_code IN (SELECT rm_code FROM crm.relationship_manager WHERE team = :principal.team)"
      crm.opportunity: "owner_rm_code IN (SELECT rm_code FROM crm.relationship_manager WHERE team = :principal.team)"
      core_banking.account: "party_id IN (SELECT party_id FROM core_banking.v_team_parties WHERE team = :principal.team)"
      core_banking.facility: "party_id IN (SELECT party_id FROM core_banking.v_team_parties WHERE team = :principal.team)"
      core_banking.party_address: "party_id IN (SELECT party_id FROM core_banking.v_team_parties WHERE team = :principal.team)"
      core_banking.party_contact: "party_id IN (SELECT party_id FROM core_banking.v_team_parties WHERE team = :principal.team)"
      crm.contact: "crm_org_id IN (SELECT crm_org_id FROM crm.account_org WHERE owner_rm_code = :principal.rm_code)"
    inheritance_note: >-
      `crm.contact` is restated UNCHANGED and deliberately: the own-book rule
      still applies to contact records, because a team lead has no servicing
      reason to hold every team member's client contacts. Restating it makes
      that a decision rather than an oversight -- version 1 overrode two
      filters and left the inheritance semantics of the other seven undefined.
      The six two-hop scopes inherited from the parent are NOT widened here and
      remain refused; a team-wide version of each would need the same view.
    notes: >-
      `v_team_parties` is a bank-side scoping view. It does not ship with this
      fixture, so these scopes are refused until it exists -- see
      `row_scope_compilation`. Seniority widens the ROW scope and nothing else:
      no additional column, no free text, no source.

  # -------------------------------------------------------------------
  credit_analyst:
    description: >-
      Assesses any borrower in the book. Sees facility, covenant and collateral
      detail; does not see who the client banks with personally, and does not
      see free text anywhere.
    purposes: [credit_assessment]
    purposes_note: >-
      `portfolio_analytics` was REMOVED. Holding it beside estate-wide
      named-row access made every aggregate-only protection on
      `portfolio_analyst` optional: the same person could read the rows
      directly and aggregate them by hand under the analytics purpose.
      Portfolio analytics is performed under `portfolio_analyst`, which is
      aggregate-only, and the two roles are mutually exclusive.
    egress_ceiling: RESTRICTED_INTERNAL
    row_filters: {}
    unscoped_objects:
      - object: core_banking.party
        justification: "credit assessment is book-wide by definition. The control is the column projection -- no contact data, no address, no free text -- not the row set."
      - object: core_banking.account
        justification: "as above; balances and product codes, no narrative."
      - object: core_banking.facility
        justification: "as above."
      - object: core_banking.facility_account
        justification: "link table; carries no personal data."
      - object: core_banking.txn
        justification: "exposure analysis needs transaction flow. `narrative` and `counterparty_name` are denied, which is where the personal data is."
      - object: core_banking.account_balance_monthly
        justification: "derived monthly balances; no personal data."
      - object: core_banking.collateral
        justification: "as above; `notes` and `description` denied."
      - object: core_banking.covenant
        justification: "as above."
      - object: core_banking.covenant_test
        justification: "as above."
      - object: crm.account_org
        justification: "sector and lifecycle stage for peer comparison. Contact records are denied outright."
      - object: crm.opportunity
        justification: "pipeline exposure. `lost_reason` denied as free text."
      - object: filings.document
        justification: "published accounts."
      - object: spreadsheets.risk_model_pd_lgd
        justification: "the model pack is the analyst's own working artefact."
      - object: spreadsheets.covenant_tracker
        justification: "as above."
      - object: spreadsheets.limit_utilisation
        justification: "as above."
      - object: spreadsheets.exposure_summary_by_sector
        justification: "already an aggregate."
      - object: payments.event
        justification: "settlement behaviour is a credit signal. Account references are masked and remittance text is denied."
      - object: payments.debtor
        justification: "the debtor side of an event, reached only through the event. `account_ref` is masked to its last four and `name_as_instructed` is denied."
      - object: payments.creditor
        justification: "as above for the creditor side."
      - object: market_data.derived_aggregates
        justification: "declared aggregates only; licensed rows are above this role's ceiling."
    allow:
      core_banking: [party, account, facility, facility_account, txn, account_balance_monthly,
                     collateral, covenant, covenant_test]
      crm: [account_org, opportunity]
      filings: [document]
      spreadsheets: [risk_model_pd_lgd, covenant_tracker, limit_utilisation,
                     exposure_summary_by_sector]
      payments: [event, debtor, creditor]
      market_data: [derived_aggregates]
    deny_tables:
      - core_banking.party_address
      - core_banking.party_contact
      - crm.contact
      - crm.interaction
    deny_columns:
      - core_banking.party.notes
      - core_banking.party.date_of_birth
      - core_banking.facility.notes
      - core_banking.collateral.notes
      - core_banking.collateral.description
      - core_banking.txn.narrative
      - core_banking.txn.counterparty_name
      - crm.account_org.external_ref
      - crm.opportunity.lost_reason
      - payments.event.remittance_info
      - payments.debtor.name_as_instructed
      - payments.creditor.name_as_instructed
      - spreadsheets.risk_model_pd_lgd.model_owner_comment
      - spreadsheets.risk_model_pd_lgd.borrower_name
      - spreadsheets.covenant_tracker.borrower
      - spreadsheets.exposure_summary_by_sector.note
    column_masks:
      payments.debtor.account_ref: last4
      payments.creditor.account_ref: last4
    stale_rules_removed: >-
      Version 1 masked `core_banking.party_contact.email` and denied
      `core_banking.party_contact.phone` for this role while the whole table
      was already in `deny_tables`. Rules over inaccessible objects are worse
      than useless: they read as protection and are dead code, and a later
      author who grants the table inherits no protection at all. Both are
      removed and the table denial is the single statement.
    deny_sources: [mailbox, credit_memos, sanctions_watchlist]
    deny_sources_note: >-
      `credit_memos` is newly denied. Version 1 gave this role every memo in
      the estate with no scope at all -- internal grades, recommendations and
      analyst opinion on borrowers it had no engagement with. A memo reaches an
      analyst through a bound credit review, and no such binding exists in this
      fixture.
    obligations: [log_every_read_with_purpose, four_eyes_on_bulk_export]

  # -------------------------------------------------------------------
  portfolio_analyst:
    description: >-
      Aggregates only. May READ named rows to compute an aggregate and may not
      EMIT them, and the constraint is STICKY -- it attaches to the derived
      value, not to the request.
    purposes: [portfolio_analytics]
    egress_ceiling: INTERNAL
    aggregate_only: true
    minimum_group_size: 5
    on_small_group: refuse
    row_filters: {}
    unscoped_objects:
      - object: core_banking.party
        justification: "book-wide by definition. All identifying columns are denied and only aggregates leave."
      - object: core_banking.account
        justification: "as above."
      - object: core_banking.facility
        justification: "as above."
      - object: core_banking.txn
        justification: "as above."
      - object: core_banking.account_balance_monthly
        justification: "as above."
      - object: core_banking.collateral
        justification: "as above."
      - object: core_banking.covenant
        justification: "as above."
      - object: core_banking.covenant_test
        justification: "as above."
      - object: crm.account_org
        justification: "sector is a grouping dimension."
      - object: crm.opportunity
        justification: "pipeline aggregates."
      - object: payments.event
        justification: "settlement volumes."
      - object: market_data.derived_aggregates
        justification: "declared aggregates only."
      - object: spreadsheets.exposure_summary_by_sector
        justification: "already an aggregate."
      - object: spreadsheets.limit_utilisation
        justification: "utilisation aggregates."
    allow:
      core_banking: [party, account, facility, txn, account_balance_monthly, collateral,
                     covenant, covenant_test]
      crm: [account_org, opportunity]
      market_data: [derived_aggregates]
      spreadsheets: [exposure_summary_by_sector, limit_utilisation]
      payments: [event]
    deny_tables: [core_banking.party_contact, core_banking.party_address, crm.contact,
                  crm.interaction]
    deny_columns:
      - core_banking.party.notes
      - core_banking.party.legal_name
      - core_banking.party.trading_name
      - core_banking.party.registration_no
      - core_banking.party.date_of_birth
      - core_banking.party.primary_rm_code
      - core_banking.facility.notes
      - core_banking.collateral.notes
      - core_banking.collateral.description
      - core_banking.txn.narrative
      - core_banking.txn.counterparty_name
      - crm.account_org.org_name
      - crm.account_org.website
      - crm.account_org.external_ref
      - crm.account_org.owner_rm_code
      - crm.opportunity.name
      - crm.opportunity.lost_reason
      - payments.event.remittance_info
      - payments.debtor.account_ref
      - payments.creditor.account_ref
      - payments.debtor.name_as_instructed
      - payments.creditor.name_as_instructed
    deny_columns_note: >-
      `primary_rm_code` and `owner_rm_code` are newly denied. An RM's book is a
      small named set of companies, so grouping by RM is grouping by a handful
      of identifiable borrowers -- see `aggregate_policy.forbidden_grouping_dimensions`.
    deny_sources: [mailbox, credit_memos, filings, sanctions_watchlist]
    obligations: [log_every_read_with_purpose]
    egress_note: >-
      This role's INTERNAL ceiling and core_banking's RESTRICTED_INTERNAL class
      mean it currently reaches NO disclosed byte of that source -- see
      `transformed_read_gap`. An aggregate computed inside the boundary and
      emitted as a derived object is the shape that closes it.
    notes: >-
      Differential privacy is deliberately NOT applied to grounded columns. A
      perturbed value does not appear in the source and would break the
      grounding wall. Confine any epsilon to declared aggregates re-typed as
      `derived` pointers carrying it (spine D8). The real controls here are in
      `aggregate_policy`: a fixed query surface, a subject-based threshold, a
      dominance rule, complementary suppression, no margins and a query budget.

  # -------------------------------------------------------------------
  compliance_officer:
    description: >-
      The only role that may read free text, and the only role with the
      watchlist. Every read is logged with its purpose and its case id; the log
      is append-only.
    purposes: [financial_crime_compliance]
    purposes_note: >-
      `audit` was REMOVED. Holding it beside full-value access meant an audit
      read performed under this role bypassed the auditor's `pointers_only`
      restriction entirely -- purpose laundering by role selection. Audit is
      performed under `auditor` or `external_auditor` and nowhere else.
    egress_ceiling: RESTRICTED_INTERNAL
    row_filters: {}
    unscoped_objects:
      - object: "*"
        justification: >-
          An investigation cannot declare its scope in advance -- that is what
          an investigation is. The controls are elsewhere and they are real:
          the purpose validates against an OPEN CASE the principal is assigned
          to, every read is logged with that case id, bulk export needs a
          second pair of eyes, free text may not leave the case file, and the
          role is mutually exclusive with model_developer so pseudonymous
          model data and raw client data never meet in one principal.
    allow:
      core_banking: ["*"]
      crm: ["*"]
      filings: [document]
      credit_memos: [document]
      mailbox: [message]
      market_data: [derived_aggregates]
      spreadsheets: ["*"]
      payments: ["*"]
      sanctions_watchlist: ["*"]
    wildcard_justification: >-
      The four wildcards are deliberate and are the only ones held by a human
      role in this file. Everything else is an explicit entity list, so a new
      table added to core_banking becomes visible to this role and to nobody
      else until it is classified -- which is the direction that fails safe.
    deny_columns: []
    deny_sources: []
    obligations:
      - log_every_read_with_purpose
      - four_eyes_on_bulk_export
      - no_export_of_free_text_outside_case_file
    notes: >-
      `core_banking.party.notes`, `crm.interaction.summary`, credit memos and
      email bodies are readable HERE AND NOWHERE ELSE -- and as of this
      revision that sentence is true, which it was not in version 1. It is the
      point of those surfaces: the estate's designated place for information
      that must exist and must not circulate.
      This role also holds the UNBOUND DOCUMENT triage grant: memos and
      messages with no trusted binding to a facility or a client are visible
      here and to no portfolio-scoped role.

  # -------------------------------------------------------------------
  model_developer:
    description: >-
      Pseudonymous features and aggregates for model work. NOT anonymous, and
      the description no longer claims otherwise.
    honesty_note: >-
      Version 1 said "No named subjects, ever" while granting exact facility
      ids, account ids, transaction ids, exact dates and exact amounts. Those
      are a fingerprint: one join against any identity-bearing extract
      re-identifies the whole feature table. The claim is now
      PSEUDONYMOUS-ONLY, and the machinery has been changed to support it --
      per-engagement pseudonyms with a destroyed key, month-generalised dates,
      banded amounts, and mutual exclusion with every identity-bearing role.
    purposes: [model_development]
    egress_ceiling: INTERNAL
    row_filters: {}
    unscoped_objects:
      - object: core_banking.account
        justification: "features are book-wide; identity is removed by transform, not by row scope."
      - object: core_banking.facility
        justification: "as above."
      - object: core_banking.txn
        justification: "as above."
      - object: core_banking.account_balance_monthly
        justification: "as above."
      - object: core_banking.covenant
        justification: "as above."
      - object: core_banking.covenant_test
        justification: "as above."
      - object: market_data.derived_aggregates
        justification: "declared aggregates only."
      - object: spreadsheets.risk_model_pd_lgd
        justification: "the model pack itself."
      - object: spreadsheets.exposure_summary_by_sector
        justification: "already an aggregate."
    allow:
      core_banking: [account, facility, txn, account_balance_monthly, covenant, covenant_test]
      market_data: [derived_aggregates]
      spreadsheets: [risk_model_pd_lgd, exposure_summary_by_sector]
    deny_tables: [core_banking.party, core_banking.party_contact, core_banking.party_address,
                  core_banking.collateral, core_banking.facility_account]
    deny_tables_note: >-
      `collateral` and `facility_account` are newly denied: a collateral
      description is a street address in prose, and the facility-account link
      table is a join graph whose shape identifies a borrower without naming
      one.
    deny_columns:
      - core_banking.account.account_no
      - core_banking.facility.notes
      - core_banking.txn.narrative
      - core_banking.txn.counterparty_name
      - core_banking.txn.counterparty_party_id
      - spreadsheets.risk_model_pd_lgd.model_owner_comment
      - spreadsheets.risk_model_pd_lgd.owner_rm
      - spreadsheets.risk_model_pd_lgd.borrower_name
    column_masks:
      core_banking.account.party_id: pseudonym_engagement
      core_banking.account.account_id: pseudonym_engagement
      core_banking.facility.party_id: pseudonym_engagement
      core_banking.facility.facility_id: pseudonym_engagement
      core_banking.txn.txn_id: pseudonym_engagement
      core_banking.txn.account_id: pseudonym_engagement
      core_banking.covenant.facility_id: pseudonym_engagement
      core_banking.covenant.covenant_id: pseudonym_engagement
      core_banking.covenant_test.covenant_id: pseudonym_engagement
      core_banking.account_balance_monthly.account_id: pseudonym_engagement
      core_banking.txn.booking_ts: month_only
      core_banking.txn.value_date: month_only
      core_banking.txn.amount: band
      core_banking.facility.limit_amount: band
      core_banking.facility.drawn_amount: band
      core_banking.account_balance_monthly.closing_balance: band
    borrower_name_note: >-
      `risk_model_pd_lgd.borrower_name` is WITHHELD, not hashed. Version 1
      hashed it; a stable hash of a borrower name preserves linkage exactly and
      is invertible by dictionary against any list of company names, which is
      most of them. Hashing a name is not de-identification. The model joins on
      the pseudonymised facility id instead.
    egress_note: >-
      This role's INTERNAL ceiling and core_banking's RESTRICTED_INTERNAL class
      mean it currently reaches NO disclosed byte of that source -- see
      `transformed_read_gap`. That is deliberate: the fix is a declared derived
      object, not a wider ceiling.
    residual_risk: >-
      Banded amounts, month-generalised dates and per-engagement pseudonyms do
      not make this dataset anonymous. A pattern of monthly balances is still a
      near-unique trajectory. What they do is remove the direct join keys and
      bound how long a pseudonym is useful. The residual is declared, and it is
      why this role is mutually exclusive with every identity-bearing role.
    deny_sources: [mailbox, crm, credit_memos, filings, payments, sanctions_watchlist]
    obligations: [log_every_read_with_purpose, watermark_every_export]

  # -------------------------------------------------------------------
  auditor:
    description: >-
      Reads the ledger and the pointers, not the values. Can establish that a
      determination was made on stated evidence, and can re-run verify() to get
      a verdict, without ever reading the evidence.
    purposes: [audit]
    egress_ceiling: INTERNAL
    pointers_only: true
    row_filters: {}
    unscoped_objects:
      - object: "*"
        justification: >-
          The audit question is estate-wide by construction. The control is
          that NO VALUE is disclosed at all -- `column_masks: {"*": redact}` --
          so the row set carries no content. What is disclosed is described in
          `pointer_disclosure` below, and it is deliberately less than version
          1 disclosed.
    allow:
      core_banking: ["*"]
      crm: ["*"]
      filings: [document]
      credit_memos: [document]
      market_data: [derived_aggregates]
      spreadsheets: ["*"]
      payments: ["*"]
    column_masks:
      "*": redact
    pointer_disclosure:
      # Review: "auditor-visible byte ranges, digests and document identifiers
      # leak document existence, approximate size, equality and change history."
      disclosed:
        - {field: pointer_id, form: pseudonym_engagement, why: "lets the auditor follow one citation through the ledger without it being a document identifier outside the engagement"}
        - {field: source_id, form: raw, why: "which system the evidence came from is the audit question"}
        - {field: entity_kind, form: raw, why: "table or document kind, not which row or which document"}
        - {field: verdict, form: raw, why: "the point of the exercise"}
        - {field: verified_at, form: raw}
        - {field: capture_status, form: raw, values: [captured, expired, vanished, never_captured]}
        - {field: policy_bundle_version, form: raw}
        - {field: withholdings_applied, form: "reason codes only, no field paths"}
      withheld:
        - {field: byte_range, reason: POLICY_INFERENCE_CONTROL, why: "an offset and a length disclose document size and, across two audits, that a document changed and by roughly how much"}
        - {field: content_digest, reason: POLICY_INFERENCE_CONTROL, why: "digest equality is a free equality oracle over documents the auditor may not read, and a digest changing between engagements is a change history nobody granted"}
        - {field: document_path, reason: POLICY_INFERENCE_CONTROL, why: "the path names the borrower; `filings/2026/dunmarch_analytics_annual_report.md` is the value"}
        - {field: row_key, reason: POLICY_INFERENCE_CONTROL, why: "a party_id is an identifier of a subject"}
      reverification:
        available: true
        how: "the auditor calls verify(pointer_id) and receives a VERDICT. The system re-reads and re-digests; the auditor does not."
        limitation_declared: >-
          The auditor therefore cannot INDEPENDENTLY re-derive a digest, and
          must trust the system's re-read. That is a real limitation of this
          design and it is stated rather than papered over: the alternative --
          handing an auditor every digest and byte range in the estate -- is a
          document-existence and change-history oracle over data they are not
          entitled to read. An independent re-derivation belongs to a
          differently-constituted engagement with its own grant, not to this
          role by default.
    deny_sources: [mailbox, sanctions_watchlist]
    deny_sources_note: >-
      `mailbox` is newly denied. Even under `pointers_only`, a per-message
      pointer inventory of a mailbox is a correspondence graph: who wrote to
      whom, when, and how often. `sanctions_watchlist` is denied because the
      existence of a screening pointer against a named party is itself the
      finding.
    obligations: [log_every_read_with_purpose, watermark_every_export]
    notes: >-
      Every value is redacted and the pointer STRUCTURE is visible. The auditor
      sees that field X of determination Y rests on a citation into source Z
      with verdict V, and can re-run verify() to get a fresh verdict, without
      reading the bytes and without learning which document it was.

  # -------------------------------------------------------------------
  platform_operator:
    description: Runs the system. Schema, health, and BANDED counts - never a value.
    purposes: [system_operation]
    egress_ceiling: INTERNAL
    metadata_only: true
    row_filters: {}
    unscoped_objects:
      - object: "*"
        justification: >-
          The operator's job is the whole estate's health, so a row scope over
          it would be meaningless. What bounds this role is `metadata_only`
          plus `metadata_disclosure` below: no cell value at any row, and
          BANDED counts rather than exact ones.
    allow: {"*": ["*"]}
    wildcard_justification: "the operator's job is the whole estate's health. `metadata_only` is what bounds it, not the object list."
    column_masks: {"*": redact}
    metadata_disclosure:
      # Review: "platform-operator counts can reveal rare or single-subject
      # populations."
      disclosed: [table_names, column_names, column_types, index_definitions, source_health,
                  cursor_position, capture_store_utilisation, error_rates]
      counts:
        form: banded
        bands: [0, 1, 5, 50, 500, 5000, 50000]
        rule: >-
          A count is returned as the band it falls in, never as an exact
          number. "1" and "2-5" are separate bands deliberately: a table with
          exactly one row in it is a single subject, and the operator has no
          operational need to know an exact cardinality that they cannot
          already infer from a band.
        exact_counts_available_to: []
        exact_counts_note: "no role in this estate receives exact counts over a personal-data object. An operator sizing a migration uses the band."
      forbidden: [any cell value, any digest of a cell, any sample row, any DISTINCT list,
                  any MIN/MAX of a data column]
      forbidden_note: "MIN and MAX are values. `MAX(party.date_of_birth)` is somebody's date of birth."
    obligations: [log_every_read_with_purpose]
    notes: Row counts and column names are metadata; a single cell value is not, and neither is an exact count of a small population.

  # -------------------------------------------------------------------
  external_auditor:
    description: Outside firm. Narrow, time-boxed, scoped by a bank-maintained table, and the only role with an expiry.
    purposes: [audit]
    egress_ceiling: INTERNAL
    pointers_only: true
    expires_on: 2026-11-30
    expiry_semantics: "see `obligation_specs.expire_grant`: Asia/Singapore, inclusive of 2026-11-30, refused from 2026-12-01T00:00:00+08:00."
    row_filters:
      core_banking.facility: "facility_id IN (SELECT facility_id FROM audit_scope_2026)"
      core_banking.covenant: "facility_id IN (SELECT facility_id FROM audit_scope_2026)"
      core_banking.collateral: "facility_id IN (SELECT facility_id FROM audit_scope_2026)"
      core_banking.covenant_test: "covenant_id IN (SELECT covenant_id FROM core_banking.v_audit_scope_covenants WHERE engagement_id = :principal.engagement_id)"
      credit_memos.document: "facility_id IN (SELECT facility_id FROM audit_scope_2026)"
    row_filters_note: >-
      Version 1 scoped `facility` alone, and granted `covenant`,
      `covenant_test`, `collateral` and EVERY credit memo in the estate with no
      scope at all -- to an outside firm. All five are now scoped to the same
      engagement table. `credit_memos.document` is scoped by the bank's INTAKE
      REGISTER binding (`trusted_bindings.credit_memos`), never by the facility
      reference printed inside the memo, which the memo's author chooses.
    row_disposition:
      default: existence_not_disclosed
      default_reason: POLICY_SCOPE_UNDISCLOSED
      note: "an outside firm must not learn how many facilities are out of its scope, which is the size of the book."
    unscoped_objects: []
    allow:
      core_banking: [facility, covenant, covenant_test, collateral]
      credit_memos: [document]
    deny_columns:
      - core_banking.facility.notes
      - core_banking.collateral.notes
      - core_banking.collateral.description
      - core_banking.facility.margin_bps
    deny_columns_note: "`margin_bps` is pricing. It is commercially restricted and is not an audit input."
    deny_tables:
      - core_banking.party
      - core_banking.party_address
      - core_banking.party_contact
    deny_tables_note: >-
      Version 1 put `core_banking.party` -- a TABLE -- into `deny_sources`,
      whose vocabulary is SOURCE IDS. A closed-vocabulary validator should
      reject that document. It is a table denial and it now sits with the table
      denials, alongside the two related tables version 1 never mentioned.
    deny_sources: [crm, mailbox, payments, market_data, sanctions_watchlist, spreadsheets, filings]
    obligations: [watermark_every_export, expire_grant, log_every_read_with_purpose]

# =====================================================================
# 16. COLUMN CLASSIFICATION -- now ENFORCEABLE, not descriptive
#
# A policy engine answers "what is this column" before it answers "who may see
# it". Version 1's classification was documentation sitting beside grants that
# contradicted it. It is now the input to two enforced rules:
#   * every column in `free_text_may_contain_personal_data` is withheld by
#     default (`free_text_policy`);
#   * a column in NEITHER a role's projection NOR this table fails closed with
#     POLICY_UNCLASSIFIED_COLUMN (`evaluation_order` stage 9).
# =====================================================================
column_classification:

  direct_identifier_of_protected_subject:
    - core_banking.party.legal_name
    - core_banking.party.trading_name
    - core_banking.party.registration_no
    - core_banking.party.date_of_birth
    - core_banking.party_contact.contact_name
