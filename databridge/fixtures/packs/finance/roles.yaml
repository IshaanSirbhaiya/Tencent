    - core_banking.txn.amount
    - crm.account_org.hq_city
    - crm.account_org.website
    - payments.debtor.account_ref
    - payments.creditor.account_ref
  quasi_identifier_note: >-
    A facility id plus an exact drawdown date plus an amount is a row in the
    borrower's own accounts, which are published. That is the re-identification
    path the model-developer transforms exist to close, and it is why they
    generalise dates and band amounts rather than masking a name and calling it
    de-identified.

  process_metadata:
    # Safe by construction: no personal content.
    - core_banking.party.party_type
