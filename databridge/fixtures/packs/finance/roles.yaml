    - crm.account_org.lifecycle_stage
    - crm.opportunity.stage
    - payments.event.event_type
    - payments.event.delivery_attempt

  commercially_restricted:
    - market_data.prices.close
    - market_data.prices.open
    - market_data.ratings.rating
    - market_data.fx.rate
    - market_data.instruments.issuer_name_as_reported
