# apps/cli — the POC product surface. T07 ships the confirmation TUI; typer app in T12.
[project]
name = "databridge-cli"
version = "0.0.0"
description = "DataBridge CLI: confirmation TUI (T07); full typer app in T12"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "databridge-semantic",
  "rich>=13",
  "prompt-toolkit>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_cli"]
